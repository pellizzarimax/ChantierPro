<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Chantiers Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;background:#f0f4fb;overscroll-behavior:none;}

input,textarea,select,button{font-family:'Outfit',sans-serif;}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── STORAGE ──────────────────────────────────────────────────
const STORAGE_KEY = "chantierspro_v2";
function loadDB() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return { clients: [], devis: [], cr: [], planning: [], settings: { entreprise: "", siret: "", tel: "", email: "", adresse: "", prefix: "DEV-2025-", nextNum: 1 } };
}
function saveDB(db) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }); } catch (e) { return iso; }
}
function fmtEur(n) {
  return (parseFloat(n) || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}
function clientName(c) { return [c.prenom, c.nom].filter(Boolean).join(" ") || c.societe || "Client sans nom"; }
function badgeStyle(statut) {
  return { brouillon: { bg: "#e5e7eb", color: "#374151" }, envoyé: { bg: "#dbeafe", color: "#1d4ed8" }, signé: { bg: "#dcfce7", color: "#16a34a" }, refusé: { bg: "#fee2e2", color: "#dc2626" } }[statut] || { bg: "#e5e7eb", color: "#374151" };
}

// ── AI DEVIS GENERATOR ───────────────────────────────────────
async function generateDevisIA(description, tarifMode) {
  const systemPrompt = `Tu es un expert devis BTP français avec 20 ans d'expérience. Tu génères des devis précis et professionnels.
Tu dois répondre UNIQUEMENT en JSON valide, sans texte avant ni après, sans balises markdown.

Format de réponse OBLIGATOIRE :
{
  "objet": "titre court du devis",
  "lignes": [
    {"designation": "nom matériau/matériel", "unite": "unité (m², u, ml, kg, sac, l, h...)", "qte": nombre, "pu": prix_unitaire_HT_euros}
  ],
  "mo": montant_main_oeuvre_HT_euros,
  "dep": montant_deplacement_HT_euros,
  "delai": "délai estimé ex: 3 jours",
  "conseils": "2-3 conseils techniques courts importants",
  "remarques": "conditions particulières, garanties"
}

Règles IMPORTANTES :
- Prix basés sur les tarifs moyens du marché BTP français ${tarifMode === "ajustables" ? "(légèrement ajustables si précisé)" : ""}
- Matériaux : prix fournisseurs professionnels (pas grande surface)
- Main d'œuvre : tarif horaire BTP 35-55€/h selon spécialité
- Sois précis sur les quantités (ajoute 10% de pertes pour carrelage, peinture, etc.)
- Maximum 12 lignes de matériaux
- Les prix sont en euros HT`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: `Génère un devis BTP détaillé pour : ${description}` }]
    })
  });
  const data = await response.json();
  const text = data.content?.find(b => b.type === "text")?.text || "";
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function AIGeneratorPanel({ onApply, visible, onToggle }) {
  const [desc, setDesc] = useState("");
  const [tarifMode, setTarifMode] = useState("marche");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");

  const handleGenerate = async () => {
    if (!desc.trim()) return;
    setLoading(true); setError(""); setResult(null);
    try {
      const data = await generateDevisIA(desc, tarifMode);
      setResult(data);
    } catch (e) {
      setError("Erreur de génération. Vérifiez votre connexion et réessayez.");
    }
    setLoading(false);
  };

  if (!visible) return (
    <button onClick={onToggle} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "13px 16px", background: "linear-gradient(135deg,#0d2347,#1e4d9e)", border: "none", borderRadius: 12, color: "#fff", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
      <span style={{ fontSize: 22 }}>✨</span>
      <div style={{ textAlign: "left" }}>
        <div>Générer avec l'IA Claude</div>
        <div style={{ fontSize: 11, opacity: .75, fontWeight: 400, marginTop: 1 }}>Décris les travaux → devis complet automatique</div>
      </div>
      <span style={{ marginLeft: "auto", fontSize: 18 }}>→</span>
    </button>
  );

  return (
    <div style={{ background: "linear-gradient(160deg,#0d2347 0%,#1a3a6e 100%)", borderRadius: 16, padding: 16, marginBottom: 16, border: "1.5px solid rgba(74,158,255,.3)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 13 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 22 }}>✨</span>
          <div><div style={{ color: "#fff", fontWeight: 700, fontSize: 15 }}>Générateur IA Claude</div><div style={{ color: "rgba(255,255,255,.65)", fontSize: 11 }}>Tarifs marché BTP France</div></div>
        </div>
        <button onClick={onToggle} style={{ background: "rgba(255,255,255,.15)", border: "none", color: "#fff", borderRadius: "50%", width: 28, height: 28, cursor: "pointer", fontSize: 14 }}>✕</button>
      </div>

      {/* Mode tarifs */}
      <div style={{ display: "flex", gap: 7, marginBottom: 11 }}>
        {[["marche","📊 Marché BTP"],["ajustables","⚙️ Personnalisés"]].map(([val,lbl]) => (
          <button key={val} onClick={() => setTarifMode(val)} style={{ flex: 1, padding: "8px 6px", borderRadius: 9, border: `1.5px solid ${tarifMode===val ? "#4a9eff" : "rgba(255,255,255,.2)"}`, background: tarifMode===val ? "rgba(74,158,255,.25)" : "rgba(255,255,255,.07)", color: "#fff", fontFamily: "inherit", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>{lbl}</button>
        ))}
      </div>

      {/* Zone de description */}
      <div style={{ marginBottom: 10 }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,.65)", fontWeight: 600, textTransform: "uppercase", letterSpacing: .5, marginBottom: 6 }}>Décris les travaux</div>
        <textarea
          value={desc}
          onChange={e => setDesc(e.target.value)}
          placeholder={"Ex: Rénovation salle de bain 8m², pose carrelage sol et mur, remplacement WC suspendu et lavabo, peinture plafond blanc, Lyon"}
          style={{ width: "100%", padding: "11px 13px", borderRadius: 9, border: "1.5px solid rgba(74,158,255,.4)", background: "rgba(255,255,255,.1)", color: "#fff", fontFamily: "inherit", fontSize: 13, resize: "none", minHeight: 80, outline: "none", boxSizing: "border-box" }}
        />
        <div style={{ fontSize: 11, color: "rgba(255,255,255,.5)", marginTop: 4 }}>💡 Plus tu es précis (surface, matériaux souhaités, localisation), meilleur sera le résultat</div>
      </div>

      <button onClick={handleGenerate} disabled={loading || !desc.trim()} style={{ width: "100%", padding: "12px", background: loading ? "rgba(255,255,255,.15)" : "linear-gradient(135deg,#4a9eff,#2d6dd4)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: loading || !desc.trim() ? "not-allowed" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        {loading ? <><span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>⟳</span> Génération en cours…</> : <><span>✨</span> Générer le devis</>}
      </button>
      <style>{`@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }`}</style>

      {error && <div style={{ marginTop: 10, background: "rgba(220,38,38,.25)", border: "1px solid rgba(220,38,38,.5)", borderRadius: 8, padding: "10px 13px", color: "#fca5a5", fontSize: 13 }}>⚠️ {error}</div>}

      {result && (
        <div style={{ marginTop: 13, background: "rgba(255,255,255,.1)", borderRadius: 12, padding: 13 }}>
          <div style={{ color: "#4affe0", fontWeight: 700, fontSize: 14, marginBottom: 10 }}>✓ Devis généré · {result.lignes?.length} lignes</div>

          {/* Aperçu lignes */}
          <div style={{ marginBottom: 10 }}>
            {result.lignes?.map((l, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid rgba(255,255,255,.1)", fontSize: 12, color: "rgba(255,255,255,.9)" }}>
                <span style={{ flex: 1, paddingRight: 8 }}>{l.designation} ({l.qte} {l.unite})</span>
                <span style={{ fontWeight: 600, whiteSpace: "nowrap" }}>{(l.qte * l.pu).toFixed(0)} €</span>
              </div>
            ))}
            {result.mo > 0 && <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12, color: "rgba(255,255,255,.9)" }}><span>🔨 Main d'œuvre</span><span style={{ fontWeight: 600 }}>{result.mo} €</span></div>}
          </div>

          {/* Infos délai + conseils */}
          {result.delai && <div style={{ background: "rgba(74,158,255,.2)", borderRadius: 8, padding: "8px 11px", marginBottom: 8, fontSize: 12, color: "#93c5fd" }}>⏱️ Délai estimé : <strong>{result.delai}</strong></div>}
          {result.conseils && <div style={{ background: "rgba(74,255,180,.1)", borderRadius: 8, padding: "8px 11px", marginBottom: 10, fontSize: 12, color: "#86efac" }}>💡 {result.conseils}</div>}

          <button onClick={() => onApply(result)} style={{ width: "100%", padding: "12px", background: "linear-gradient(135deg,#16a34a,#22c55e)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
            ✓ Appliquer au devis
          </button>
        </div>
      )}
    </div>
  );
}

// ── NOTE SCANNER ─────────────────────────────────────────────
async function scanNotesIA(imageBase64, targetType) {
  const systemDevis = `Tu es un expert BTP français. Tu analyses une photo de notes manuscrites et tu génères un devis professionnel.
Réponds UNIQUEMENT en JSON valide, sans texte ni balises markdown.
Format OBLIGATOIRE :
{
  "objet": "titre court du devis",
  "lignes": [{"designation": "matériau/matériel", "unite": "m²/u/ml/kg/sac", "qte": nombre, "pu": prix_HT_euros}],
  "mo": montant_main_oeuvre_HT,
  "dep": montant_deplacement_HT,
  "delai": "délai estimé",
  "conseils": "conseils techniques",
  "remarques": "conditions particulières",
  "client_nom": "nom client si lisible sinon vide",
  "adresse": "adresse chantier si lisible sinon vide"
}
Prix = tarifs marché BTP France. Interprète les abréviations courantes.`;

  const systemCR = `Tu es un expert BTP français. Tu analyses une photo de notes manuscrites de chantier et tu génères un compte rendu de visite structuré.
Réponds UNIQUEMENT en JSON valide, sans texte ni balises markdown.
Format OBLIGATOIRE :
{
  "nature": "type de travaux",
  "adresse": "adresse chantier si lisible",
  "interlocuteur": "nom interlocuteur si lisible",
  "etat": "état des lieux constaté (texte)",
  "realises": "travaux réalisés (texte)",
  "vigilance": "points de vigilance (texte)",
  "actions": "actions à prévoir (texte)",
  "avancement": nombre_entre_0_et_100,
  "client_nom": "nom client si lisible sinon vide"
}
Interprète les abréviations et reformule de façon professionnelle.`;

  const systemPropre = `Tu es un assistant professionnel BTP. Tu analyses une photo de notes manuscrites et tu les retranscris de façon claire, structurée et professionnelle en français.
Réponds UNIQUEMENT en JSON valide, sans texte ni balises markdown.
Format OBLIGATOIRE :
{
  "titre": "titre résumant le contenu des notes",
  "date": "date si présente dans les notes sinon vide",
  "client": "nom client si présent sinon vide",
  "chantier": "adresse ou nom du chantier si présent sinon vide",
  "sections": [
    { "titre": "titre de la section", "contenu": "texte mis au propre de cette section" }
  ],
  "points_cles": ["point clé 1", "point clé 2"],
  "a_retenir": "résumé en 1-2 phrases des points importants"
}
- Corrige l'orthographe et la grammaire
- Développe les abréviations (ex: sb = salle de bain, ch = chambre, m² = mètres carrés)
- Reformule les phrases telegraphiques en phrases complètes et professionnelles
- Regroupe les informations par thème logique dans les sections
- Garde TOUTE l'information, ne supprime rien d'important`;

  const systemMap = { devis: systemDevis, cr: systemCR, propre: systemPropre };
  const promptMap = {
    devis: "Analyse ces notes manuscrites et génère un devis BTP complet.",
    cr: "Analyse ces notes manuscrites et génère un compte rendu de visite chantier.",
    propre: "Retranscris ces notes manuscrites de façon claire, structurée et professionnelle."
  };

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1800,
      system: systemMap[targetType],
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageBase64 } },
          { type: "text", text: promptMap[targetType] }
        ]
      }]
    })
  });
  const data = await response.json();
  const text = data.content?.find(b => b.type === "text")?.text || "";
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function NoteScanner({ clients, onApplyDevis, onApplyCR, onClose }) {
  const camRef = useRef();
  const galRef = useRef();
  const [step, setStep] = useState("choose");
  const [targetType, setTargetType] = useState("devis");
  const [imageData, setImageData] = useState(null);
  const [imageBase64, setImageBase64] = useState(null);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [copyDone, setCopyDone] = useState(false);
  const [editedSections, setEditedSections] = useState([]);

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new window.Image();
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const jpeg = canvas.toDataURL("image/jpeg", 0.9);
        setImageData(jpeg);
        setImageBase64(jpeg.split(",")[1]);
        setStep("preview");
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleScan = async () => {
    setLoading(true); setError(""); setStep("scanning");
    try {
      const data = await scanNotesIA(imageBase64, targetType);
      setResult(data);
      if (targetType === "propre" && data.sections) {
        setEditedSections(data.sections.map(s => ({ ...s })));
      }
      setStep("result");
    } catch (e) {
      setError("Impossible d'analyser l'image. Essayez avec une photo plus nette.");
      setStep("preview");
    }
    setLoading(false);
  };

  const buildPropreText = (r, secs) => {
    let txt = `📋 ${r.titre || "Notes mises au propre"}\n`;
    if (r.date) txt += `📅 Date : ${r.date}\n`;
    if (r.client) txt += `👤 Client : ${r.client}\n`;
    if (r.chantier) txt += `📍 Chantier : ${r.chantier}\n`;
    txt += "\n";
    (secs || r.sections || []).forEach(s => {
      txt += `── ${s.titre.toUpperCase()} ──\n${s.contenu}\n\n`;
    });
    if (r.points_cles?.length) {
      txt += `── POINTS CLÉS ──\n${r.points_cles.map(p => `• ${p}`).join("\n")}\n\n`;
    }
    if (r.a_retenir) txt += `💡 À RETENIR : ${r.a_retenir}`;
    return txt;
  };

  const handleCopy = (r, secs) => {
    const txt = buildPropreText(r, secs);
    navigator.clipboard.writeText(txt).then(() => { setCopyDone(true); setTimeout(() => setCopyDone(false), 2000); });
  };

  const bgPanel = "linear-gradient(160deg,#07142e 0%,#0f2a5e 100%)";
  const btnClose = <button onClick={onClose} style={{ marginLeft: "auto", background: "rgba(255,255,255,.12)", border: "none", color: "#fff", borderRadius: "50%", width: 28, height: 28, cursor: "pointer", fontSize: 14, flexShrink: 0 }}>✕</button>;

  // ── STEP: CHOOSE ──
  if (step === "choose") return (
    <div style={{ background: bgPanel, borderRadius: 16, padding: 18, border: "1.5px solid rgba(74,158,255,.3)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <span style={{ fontSize: 26 }}>📒</span>
        <div><div style={{ color: "#fff", fontWeight: 700, fontSize: 16 }}>Scanner mes notes</div><div style={{ color: "rgba(255,255,255,.6)", fontSize: 12 }}>Photo → Document professionnel automatique</div></div>
        {btnClose}
      </div>

      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,.55)", fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, marginBottom: 8 }}>Que souhaitez-vous faire ?</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 7 }}>
          {[
            ["devis",   "📋", "Créer un devis",     "Matériaux + prix auto"],
            ["cr",      "📝", "Compte rendu",        "Observations chantier"],
            ["propre",  "✍️", "Mettre au propre",   "Notes structurées"],
          ].map(([val, ic, lbl, sub]) => (
            <button key={val} onClick={() => setTargetType(val)} style={{ padding: "11px 6px", borderRadius: 11, border: `2px solid ${targetType===val ? "#4a9eff" : "rgba(255,255,255,.15)"}`, background: targetType===val ? "rgba(74,158,255,.22)" : "rgba(255,255,255,.06)", color: "#fff", fontFamily: "inherit", cursor: "pointer", textAlign: "center" }}>
              <div style={{ fontSize: 20, marginBottom: 5 }}>{ic}</div>
              <div style={{ fontSize: 12, fontWeight: 700, lineHeight: 1.2 }}>{lbl}</div>
              <div style={{ fontSize: 10, opacity: .6, marginTop: 3, lineHeight: 1.2 }}>{sub}</div>
            </button>
          ))}
        </div>
      </div>

      {targetType === "propre" && (
        <div style={{ background: "rgba(255,255,255,.07)", borderRadius: 9, padding: "9px 12px", marginBottom: 12, fontSize: 12, color: "rgba(255,255,255,.7)", lineHeight: 1.5 }}>
          ✍️ <strong style={{ color: "#fff" }}>Mettre au propre</strong> : Claude lit tes notes manuscrites, corrige l'orthographe, développe les abréviations et restructure le tout en document professionnel clair et lisible — que tu peux copier ou envoyer directement.
        </div>
      )}

      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => camRef.current.click()} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: "13px 8px", background: "rgba(255,255,255,.1)", border: "1.5px solid rgba(255,255,255,.2)", borderRadius: 12, cursor: "pointer", color: "#fff", fontFamily: "inherit", fontSize: 13, fontWeight: 600 }}>
          <span style={{ fontSize: 24 }}>📷</span>Prendre en photo
        </button>
        <button onClick={() => galRef.current.click()} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: "13px 8px", background: "rgba(255,255,255,.1)", border: "1.5px solid rgba(255,255,255,.2)", borderRadius: 12, cursor: "pointer", color: "#fff", fontFamily: "inherit", fontSize: 13, fontWeight: 600 }}>
          <span style={{ fontSize: 24 }}>🖼️</span>Photothèque
        </button>
      </div>
      <div style={{ fontSize: 11, color: "rgba(255,255,255,.38)", marginTop: 8, textAlign: "center" }}>💡 Bonne lumière + image nette = meilleur résultat</div>
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={e => handleFile(e.target.files[0])} />
      <input ref={galRef} type="file" accept="image/*" style={{ display: "none" }} onChange={e => handleFile(e.target.files[0])} />
    </div>
  );

  // ── STEP: PREVIEW ──
  if (step === "preview") return (
    <div style={{ background: bgPanel, borderRadius: 16, padding: 18, border: "1.5px solid rgba(74,158,255,.3)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 13 }}>
        <button onClick={() => { setStep("choose"); setImageData(null); setError(""); }} style={{ background: "rgba(255,255,255,.12)", border: "none", color: "#fff", borderRadius: 8, padding: "5px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 13 }}>← Retour</button>
        <span style={{ color: "#fff", fontWeight: 700, fontSize: 14 }}>
          {targetType === "propre" ? "✍️" : targetType === "devis" ? "📋" : "📝"} Aperçu · {targetType === "propre" ? "Mise au propre" : targetType === "devis" ? "Devis" : "Compte rendu"}
        </span>
        {btnClose}
      </div>
      <img src={imageData} alt="notes" style={{ width: "100%", borderRadius: 10, maxHeight: 250, objectFit: "contain", background: "#000", marginBottom: 12 }} />

      <div style={{ display: "flex", gap: 8 }}>

  if (step === "result" && result) {

            {result.titre && <div style={{ color: "#fff", fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{result.titre}</div>}
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {result.date    && <span style={{ background: "rgba(74,158,255,.2)", color: "#93c5fd", borderRadius: 20, padding: "2px 9px", fontSize: 11, fontWeight: 600 }}>📅 {result.date}</span>}
              {result.client  && <span style={{ background: "rgba(74,158,255,.2)", color: "#93c5fd", borderRadius: 20, padding: "2px 9px", fontSize: 11, fontWeight: 600 }}>👤 {result.client}</span>}
              {result.chantier && <span style={{ background: "rgba(74,158,255,.2)", color: "#93c5fd", borderRadius: 20, padding: "2px 9px", fontSize: 11, fontWeight: 600 }}>📍 {result.chantier}</span>}
            </div>
          </div>

          {/* Sections éditables */}
          <div style={{ maxHeight: 280, overflowY: "auto", display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
            {editedSections.map((s, i) => (
              <div key={i} style={{ background: "rgba(255,255,255,.07)", borderRadius: 9, padding: "10px 12px" }}>
                <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, marginBottom: 6 }}>{s.titre}</div>
                <textarea
                  value={s.contenu}
                  onChange={e => {
                    const next = [...editedSections];
                    next[i] = { ...next[i], contenu: e.target.value };
                    setEditedSections(next);
                  }}
                  style={{ width: "100%", background: "rgba(255,255,255,.06)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 7, color: "#fff", fontFamily: "inherit", fontSize: 13, padding: "8px 10px", resize: "none", outline: "none", boxSizing: "border-box", lineHeight: 1.5, minHeight: 60 }}
                  rows={Math.max(2, s.contenu.split("\n").length)}
                />
              </div>
            ))}

            {result.points_cles?.length > 0 && (
              <div style={{ background: "rgba(255,255,255,.07)", borderRadius: 9, padding: "10px 12px" }}>
                <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, marginBottom: 6 }}>Points clés</div>
                {result.points_cles.map((p, i) => <div key={i} style={{ fontSize: 13, color: "rgba(255,255,255,.85)", padding: "2px 0" }}>• {p}</div>)}
              </div>
            )}

            {result.a_retenir && (
              <div style={{ background: "rgba(255,220,80,.1)", border: "1px solid rgba(255,220,80,.25)", borderRadius: 9, padding: "9px 12px" }}>
                <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700, marginBottom: 4 }}>💡 À RETENIR</div>
                <div style={{ fontSize: 13, color: "rgba(255,255,255,.85)" }}>{result.a_retenir}</div>
              </div>
            )}
          </div>

          {/* Actions */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => { setStep("choose"); setImageData(null); setResult(null); setEditedSections([]); }} style={{ flex: "0 0 auto", padding: "10px 13px", background: "rgba(255,255,255,.12)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>🔄</button>
            <button onClick={() => handleCopy(result, editedSections)} style={{ flex: 1, padding: "10px", background: copyDone ? "rgba(22,163,74,.4)" : "rgba(255,255,255,.15)", border: `1.5px solid ${copyDone ? "#22c55e" : "rgba(255,255,255,.25)"}`, borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all .3s" }}>
              {copyDone ? "✓ Copié !" : "📋 Copier le texte"}
            </button>
            <button onClick={() => onApplyCR({ etat: editedSections.map(s => `${s.titre}: ${s.contenu}`).join("\n\n"), actions: result.points_cles?.join("\n") || "", nature: "Rénovation intérieure", avancement: 0, client_nom: result.client || "" })}

              📝 → Compte rendu
            </button>
          </div>
        </div>
      );
    }

    // ── RÉSULTAT : DEVIS ──
    if (targetType === "devis") {
      const totHT = ((result.lignes || []).reduce((s, l) => s + l.qte * l.pu, 0) + (result.mo || 0) + (result.dep || 0));
      return (
        <div style={{ background: bgPanel, borderRadius: 16, padding: 16, border: "1.5px solid rgba(74,255,180,.3)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>

          </div>

          <div style={{ marginBottom: 10, maxHeight: 180, overflowY: "auto" }}>
            {result.lignes?.map((l, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid rgba(255,255,255,.08)", fontSize: 12, color: "rgba(255,255,255,.85)" }}>

                <span style={{ fontWeight: 700, color: "#4a9eff", whiteSpace: "nowrap" }}>{(l.qte * l.pu).toFixed(0)} €</span>
              </div>
            ))}
            {result.mo > 0 && <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12, color: "rgba(255,255,255,.85)" }}><span>🔨 Main d'œuvre</span><span style={{ fontWeight: 700, color: "#4a9eff" }}>{result.mo} €</span></div>}
          </div>
          <div style={{ background: "rgba(74,158,255,.2)", borderRadius: 8, padding: "8px 11px", marginBottom: 10, display: "flex", justifyContent: "space-between", fontWeight: 700 }}>
            <span style={{ color: "#fff" }}>Total HT estimé</span><span style={{ color: "#4affe0", fontSize: 16 }}>{totHT.toFixed(0)} €</span>
          </div>
          {result.delai && <div style={{ fontSize: 12, color: "rgba(255,255,255,.6)", marginBottom: 6 }}>⏱️ Délai : {result.delai}</div>}
          {result.conseils && <div style={{ background: "rgba(74,255,180,.1)", borderRadius: 8, padding: "8px 11px", marginBottom: 10, fontSize: 12, color: "#86efac" }}>💡 {result.conseils}</div>}
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { setStep("choose"); setImageData(null); setResult(null); }} style={{ flex: 1, padding: "11px", background: "rgba(255,255,255,.12)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>🔄 Rescanner</button>
            <button onClick={() => onApplyDevis(result)} style={{ flex: 2, padding: "11px", background: "linear-gradient(135deg,#16a34a,#22c55e)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>✓ Créer le devis</button>
          </div>
        </div>
      );
    }

    // ── RÉSULTAT : COMPTE RENDU ──
    return (
      <div style={{ background: bgPanel, borderRadius: 16, padding: 16, border: "1.5px solid rgba(74,255,180,.3)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
          <span style={{ fontSize: 20 }}>✅</span>
          <div style={{ color: "#4affe0", fontWeight: 700, fontSize: 15 }}>Compte rendu généré</div>
          {btnClose}
        </div>
        {[["🔍 État des lieux", result.etat], ["✅ Travaux réalisés", result.realises], ["⚠️ Vigilance", result.vigilance], ["📌 Actions", result.actions]].filter(x => x[1]).map(([lbl, val]) => (
          <div key={lbl} style={{ background: "rgba(255,255,255,.07)", borderRadius: 8, padding: "8px 11px", marginBottom: 7 }}>
            <div style={{ fontSize: 11, color: "#4a9eff", fontWeight: 700, marginBottom: 3 }}>{lbl}</div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,.85)" }}>{val}</div>
          </div>
        ))}
        {result.avancement > 0 && <div style={{ fontSize: 12, color: "rgba(255,255,255,.6)", marginBottom: 10 }}>⚙️ Avancement estimé : {result.avancement}%</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { setStep("choose"); setImageData(null); setResult(null); }} style={{ flex: 1, padding: "11px", background: "rgba(255,255,255,.12)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>🔄 Rescanner</button>
          <button onClick={() => onApplyCR(result)} style={{ flex: 2, padding: "11px", background: "linear-gradient(135deg,#16a34a,#22c55e)", border: "none", borderRadius: 9, color: "#fff", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>✓ Créer le compte rendu</button>
        </div>
      </div>
    );
  }
  return null;
}

<div class="header">
  <div>
    <div class="header-title">📋 Compte rendu de visite chantier</div>
    <div class="header-sub">${s.entreprise || ""}</div>
  </div>
  <div class="header-right">
    <div>${fmtDate(cr.date)} à ${cr.heure || ""}</div>
    <div style="margin-top:4px">Avancement : ${cr.avancement}%</div>
  </div>
</div>

<div class="info-grid">
  ${c ? `<div class="info-box"><div class="info-label">Client</div><div class="info-value">${clientName(c)}</div></div>` : ""}
  ${cr.adresse ? `<div class="info-box"><div class="info-label">Adresse chantier</div><div class="info-value">${cr.adresse}</div></div>` : ""}
  ${cr.nature ? `<div class="info-box"><div class="info-label">Nature des travaux</div><div class="info-value">${cr.nature}</div></div>` : ""}
  ${cr.interlocuteur ? `<div class="info-box"><div class="info-label">Interlocuteur</div><div class="info-value">${cr.interlocuteur}</div></div>` : ""}
</div>

<div class="section" style="margin-bottom:10px">
  <div class="info-label" style="margin-bottom:5px">Avancement global : ${cr.avancement}%</div>
  <div class="progress-bar"><div class="progress-fill" style="width:${cr.avancement}%"></div></div>
</div>

${cr.etat ? `<div class="section"><div class="section-title">🔍 État des lieux constaté</div><div class="section-content">${cr.etat}</div></div>` : ""}
${cr.realises ? `<div class="section"><div class="section-title">✅ Travaux réalisés</div><div class="section-content">${cr.realises}</div></div>` : ""}
${cr.vigilance ? `<div class="section"><div class="section-title">⚠️ Points de vigilance</div><div class="section-content">${cr.vigilance}</div></div>` : ""}
${cr.actions ? `<div class="section"><div class="section-title">📌 Actions à prévoir</div><div class="section-content">${cr.actions}</div></div>` : ""}
${cr.prochaine ? `<div style="margin-top:12px;font-size:12px;color:#6b84a8">📅 Prochaine visite prévue : <strong>${fmtDate(cr.prochaine)}</strong></div>` : ""}

<div class="sign-row">
  <div class="sign-box"><div class="sign-label">Visa client / ${cr.visa || "Signature"}</div><div style="font-size:10px;color:#94a3b8">Date :</div></div>
  <div class="sign-box"><div class="sign-label">Cachet entreprise</div></div>
</div>

<div class="footer">${s.entreprise || ""} ${s.siret ? `· SIRET ${s.siret}` : ""} · Compte rendu du ${fmtDate(cr.date)}</div>
<script>window.onload=()=>window.print();<\/script>
</body></html>`;
  };

  // ── ACTIONS ──
  const doDownload = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const doShare = (item, type) => {
    const html = type === "devis" ? buildDevisHTML(item) : buildCRHTML(item);
    const c = db.clients.find(x => x.id === item.clientId);
    const name = type === "devis" ? `Devis_${item.numero}` : `CR_${c ? clientName(c).replace(/ /g,"_") : "chantier"}_${item.date}`;

    if (fileType === "pdf" || fileType === "print") {
      const w = window.open("", "_blank");
      if (w) { w.document.write(html); w.document.close(); }
      showToast("✓ Fenêtre d'impression ouverte");
    } else if (fileType === "html") {
      doDownload(new Blob([html], { type: "text/html;charset=utf-8" }), `${name}.html`);
      showToast("✓ Fichier HTML téléchargé", "success");
    } else if (fileType === "csv" && type === "devis") {
      let csv = `"Devis N°:","${item.numero}"\n"Date:","${fmtDate(item.date)}"\n"Client:","${c ? clientName(c) : "—"}"\n"Objet:","${item.objet}"\n\n`;
      csv += `"Désignation","Unité","Quantité","P.U. HT","Total HT"\n`;
      (item.lignes || []).forEach(l => { csv += `"${l.designation}","${l.unite}","${l.qte}","${l.pu}","${(l.qte*l.pu).toFixed(2)}"\n`; });
      csv += `\n"Total HT:","${item.totalHT?.toFixed(2)} €"\n"TVA ${item.tva}%:","${item.totalTVA?.toFixed(2)} €"\n"Total TTC:","${item.totalTTC?.toFixed(2)} €"\n`;
      doDownload(new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8" }), `${name}_BatApplidevis.csv`);
      showToast("✓ Export CSV téléchargé", "success");
    } else if (fileType === "json") {
      const obj = type === "devis"
        ? { source:"ChantiersPro", compatible:"BatApplidevis", devis:{ numero:item.numero, date:item.date, objet:item.objet }, client: c ? { nom:clientName(c), tel:c.tel, email:c.email } : null, lignes:(item.lignes||[]).map(l=>({ designation:l.designation, unite:l.unite, quantite:l.qte, prixUnitaireHT:l.pu, totalHT:parseFloat((l.qte*l.pu).toFixed(2)) })), totaux:{ ht:item.totalHT, tva:item.totalTVA, ttc:item.totalTTC } }
        : { source:"ChantiersPro", type:"compte_rendu", date:item.date, client: c ? clientName(c) : null, ...item };
      doDownload(new Blob([JSON.stringify(obj, null, 2)], { type:"application/json" }), `${name}.json`);
      showToast("✓ Export JSON téléchargé", "success");
    } else if (fileType === "txt") {
      let txt = type === "devis"
        ? `DEVIS N° ${item.numero}\n${"=".repeat(40)}\nEntreprise : ${s.entreprise||""}\nDate : ${fmtDate(item.date)}\nClient : ${c ? clientName(c) : "—"}\nObjet : ${item.objet}\n\n${"─".repeat(40)}\n`
          + (item.lignes||[]).map(l => `${l.designation.padEnd(28)} ${String(l.qte).padStart(4)} ${l.unite.padEnd(4)} × ${String(l.pu+"€").padStart(7)} = ${(l.qte*l.pu).toFixed(2)} €`).join("\n")
          + `\n${"─".repeat(40)}\nTotal HT  : ${item.totalHT?.toFixed(2)} €\nTVA ${item.tva}%   : ${item.totalTVA?.toFixed(2)} €\nTotal TTC : ${item.totalTTC?.toFixed(2)} €\n`
        : `COMPTE RENDU DE VISITE CHANTIER\n${"=".repeat(40)}\nDate : ${fmtDate(item.date)} à ${item.heure||""}\nClient : ${c ? clientName(c) : "—"}\nAdresse : ${item.adresse||"—"}\nNature : ${item.nature||""}\nAvancement : ${item.avancement}%\n\n`
          + [["État des lieux",item.etat],["Travaux réalisés",item.realises],["Points de vigilance",item.vigilance],["Actions à prévoir",item.actions]].filter(x=>x[1]).map(([k,v])=>`── ${k.toUpperCase()} ──\n${v}`).join("\n\n");
      doDownload(new Blob([txt], { type:"text/plain;charset=utf-8" }), `${name}.txt`);
      showToast("✓ Export texte téléchargé", "success");
    } else if (fileType === "email") {
      const subject = type === "devis" ? `Devis N° ${item.numero} — ${item.objet}` : `Compte rendu chantier — ${fmtDate(item.date)}`;
      const body = type === "devis"
        ? `Bonjour,\n\nVeuillez trouver ci-joint le devis N° ${item.numero} pour : ${item.objet}.\n\nMontant TTC : ${item.totalTTC?.toFixed(2)} €\nValidité : ${item.validite} jours\n\nCordialement,\n${s.entreprise||""}\n${s.tel||""}`
        : `Bonjour,\n\nSuite à notre visite chantier du ${fmtDate(item.date)}, veuillez trouver le compte rendu.\n\nAvancement : ${item.avancement}%\n\nCordialement,\n${s.entreprise||""}\n${s.tel||""}`;
      const mailto = `mailto:${c?.email||""}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.open(mailto);
      showToast("✓ Email préparé");
    }
  };

  // ── IMPORT/EXPORT DB ──
  const exportDB = (fmt) => {
    if (fmt === "json") {
      const { cr: crData, ...rest } = db;
      const exportObj = { ...db, exportedAt: new Date().toISOString(), version: "2" };
      doDownload(new Blob([JSON.stringify(exportObj, null, 2)], { type:"application/json" }), `ChantiersPro_sauvegarde_${new Date().toISOString().split("T")[0]}.json`);
      showToast("✓ Sauvegarde exportée", "success");
    } else if (fmt === "csv-clients") {
      let csv = `"Prénom","Nom","Société","Type","Téléphone","Email","Adresse","CP","Ville","Notes"\n`;
      db.clients.forEach(c => { csv += `"${c.prenom||""}","${c.nom||""}","${c.societe||""}","${c.type||""}","${c.tel||""}","${c.email||""}","${c.adresse||""}","${c.cp||""}","${c.ville||""}","${c.notes||""}"\n`; });
      doDownload(new Blob(["\uFEFF"+csv], { type:"text/csv;charset=utf-8" }), "ChantiersPro_clients.csv");
      showToast("✓ Liste clients exportée", "success");
    } else if (fmt === "csv-devis") {
      let csv = `"Numéro","Date","Client","Objet","Statut","Total HT","TVA","Total TTC"\n`;
      db.devis.forEach(d => { const c = db.clients.find(x=>x.id===d.clientId); csv += `"${d.numero}","${fmtDate(d.date)}","${c?clientName(c):"—"}","${d.objet}","${d.statut}","${d.totalHT?.toFixed(2)}","${d.totalTVA?.toFixed(2)}","${d.totalTTC?.toFixed(2)}"\n`; });
      doDownload(new Blob(["\uFEFF"+csv], { type:"text/csv;charset=utf-8" }), "ChantiersPro_devis.csv");
      showToast("✓ Liste devis exportée", "success");
    }
  };

  const importDB = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.clients || !data.devis) throw new Error("Format invalide");
        if (window.confirm(`Importer ${data.clients.length} clients et ${data.devis.length} devis ? Les données actuelles seront remplacées.`)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          window.location.reload();
        }
      } catch { showToast("⚠️ Fichier invalide ou corrompu", "error"); }
    };
    reader.readAsText(file);
  };

  // ── STYLES LOCAUX ──
  const card = { background:"#fff", borderRadius:12, padding:"13px 15px", boxShadow:"0 1px 4px rgba(13,35,71,.07)", border:"1px solid #e2e8f5", marginBottom:10 };
  const selBtn = (active) => ({ flex:1, padding:"8px 6px", borderRadius:8, border:`1.5px solid ${active?"#1e4d9e":"#cbd5e8"}`, background:active?"#1e4d9e":"#fff", color:active?"#fff":"#6b84a8", fontFamily:"inherit", fontSize:11, fontWeight:700, cursor:"pointer", textAlign:"center" });
  const actionBtn = (col) => ({ display:"flex", alignItems:"center", gap:10, width:"100%", padding:"12px 14px", background:col||"#f0f6ff", border:"none", borderRadius:10, cursor:"pointer", fontFamily:"inherit", marginBottom:8 });

  const items = shareTab === "devis" ? db.devis : db.cr;
  const selected = items.find(x => x.id === selectedId);

  // file type options per content type
  const fileTypes = shareTab === "devis"
    ? [["pdf","🖨️","PDF / Imprimer"],["html","🌐","HTML"],["csv","📊","CSV (BatApplidevis)"],["json","🔗","JSON"],["txt","📄","Texte"],["email","📧","Email"]]
    : [["pdf","🖨️","PDF / Imprimer"],["html","🌐","HTML"],["json","🔗","JSON"],["txt","📄","Texte"],["email","📧","Email"]];

  return (
    <div style={{ ...S.screen, paddingBottom:100 }}>
      {/* Hero */}
      <div style={{ background:"linear-gradient(135deg,#0d2347,#1a3a6e,#1e4d9e)", padding:"22px 20px 26px", color:"#fff" }}>
        <div style={{ fontSize:13, opacity:.7, marginBottom:3 }}>Partage & Export</div>
        <div style={{ fontSize:20, fontWeight:700, marginBottom:4 }}>📤 Partager</div>
        <div style={{ fontSize:12, opacity:.65 }}>{db.devis.length} devis · {db.cr.length} comptes rendus · {db.clients.length} clients</div>
      </div>

      {/* Tabs */}
      <div style={{ display:"flex", gap:6, padding:"12px 18px", borderBottom:"1px solid #e2e8f5", background:"#fff" }}>
        {[["devis","📋","Devis"],["cr","📝","Comptes rendus"],["donnees","🗄️","Données"]].map(([id,ic,lbl]) => (
          <button key={id} style={S.tab(shareTab===id)} onClick={()=>{ setShareTab(id); setSelectedId(null); }}>{ic} {lbl}</button>
        ))}
      </div>

      <div style={{ padding:"16px 18px" }}>

        {/* ── DONNÉES (import/export global) ── */}
        {shareTab === "donnees" && (<>
          <div style={{ fontSize:13, color:"#6b84a8", marginBottom:14 }}>Sauvegardez ou restaurez l'ensemble de vos données.</div>

          <div style={{ fontSize:12, fontWeight:700, color:"#1e4d9e", textTransform:"uppercase", letterSpacing:.5, marginBottom:10 }}>📥 Exporter</div>
          {[
            ["json","💾","Sauvegarde complète (JSON)","Tous clients, devis, CR, planning","#f0f6ff","#1a2740"],
            ["csv-clients","👥","Liste clients (CSV)","Importable dans Excel","#f0fdf4","#1a2740"],
            ["csv-devis","📋","Liste devis (CSV)","Tableau de bord chiffre d'affaires","#fffbeb","#1a2740"],
          ].map(([fmt,ic,lbl,sub,bg,col]) => (
            <button key={fmt} style={{ ...actionBtn(bg), justifyContent:"space-between" }} onClick={()=>exportDB(fmt)}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:22 }}>{ic}</span>
                <div><div style={{ fontWeight:600, fontSize:14, color:col }}>{lbl}</div><div style={{ fontSize:11, color:"#6b84a8", marginTop:1 }}>{sub}</div></div>
              </div>
              <span style={{ fontSize:18, color:"#1e4d9e" }}>↓</span>
            </button>
          ))}

          <div style={{ fontSize:12, fontWeight:700, color:"#1e4d9e", textTransform:"uppercase", letterSpacing:.5, margin:"18px 0 10px" }}>📤 Importer</div>
          <div style={{ background:"#fff8f0", border:"1.5px dashed #f97316", borderRadius:12, padding:"16px", textAlign:"center", cursor:"pointer" }} onClick={()=>fileInputRef.current?.click()}>
            <div style={{ fontSize:28, marginBottom:6 }}>📂</div>
            <div style={{ fontWeight:700, fontSize:14, color:"#c2410c" }}>Importer une sauvegarde</div>
            <div style={{ fontSize:12, color:"#9a3412", marginTop:4 }}>Fichier JSON exporté depuis Chantiers Pro</div>
            <div style={{ fontSize:11, color:"#f97316", marginTop:8, fontWeight:600 }}>⚠️ Remplace les données actuelles</div>
          </div>
          <input ref={fileInputRef} type="file" accept=".json" style={{ display:"none" }} onChange={importDB} />
        </>)}

        {/* ── DEVIS / CR ── */}
        {(shareTab === "devis" || shareTab === "cr") && (<>

          {/* Sélecteur document */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:12, fontWeight:700, color:"#1e4d9e", textTransform:"uppercase", letterSpacing:.5, marginBottom:8 }}>
              {shareTab === "devis" ? "1 · Choisir un devis" : "1 · Choisir un compte rendu"}
            </div>
            {items.length === 0
              ? <div style={{ textAlign:"center", padding:"20px", color:"#6b84a8", fontSize:13, background:"#f8faff", borderRadius:10 }}>Aucun {shareTab === "devis" ? "devis" : "compte rendu"} disponible</div>
              : <div style={{ display:"flex", flexDirection:"column", gap:8, maxHeight:210, overflowY:"auto" }}>
                  {items.map(item => {
                    const c = db.clients.find(x => x.id === item.clientId);
                    const isSelected = selectedId === item.id;
                    return (
                      <div key={item.id} onClick={() => setSelectedId(item.id)} style={{ ...card, border:`2px solid ${isSelected?"#1e4d9e":"#e2e8f5"}`, background:isSelected?"#f0f6ff":"#fff", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:0 }}>
                        <div>
                          <div style={{ fontWeight:600, fontSize:14 }}>{shareTab==="devis" ? item.numero : (c ? clientName(c) : "—")}</div>
                          <div style={{ fontSize:12, color:"#6b84a8", marginTop:1 }}>{shareTab==="devis" ? item.objet : `${item.nature} · ${fmtDate(item.date)}`}</div>
                        </div>
                        <div style={{ textAlign:"right" }}>
                          {shareTab==="devis" && <div style={{ fontWeight:700, color:"#1e4d9e", fontSize:14 }}>{fmtEur(item.totalTTC)}</div>}
                          <span style={S.badge(item.statut||"brouillon")}>{item.statut||fmtDate(item.date)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
            }
          </div>

          {/* Type de fichier */}
          {selectedId && (<>
            <div style={{ fontSize:12, fontWeight:700, color:"#1e4d9e", textTransform:"uppercase", letterSpacing:.5, marginBottom:8 }}>2 · Format du fichier</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:7, marginBottom:16 }}>
              {fileTypes.map(([val,ic,lbl]) => (
                <button key={val} onClick={()=>setFileType(val)} style={{ padding:"10px 6px", borderRadius:10, border:`2px solid ${fileType===val?"#1e4d9e":"#e2e8f5"}`, background:fileType===val?"#1e4d9e":"#fff", color:fileType===val?"#fff":"#4a5980", fontFamily:"inherit", cursor:"pointer", textAlign:"center" }}>
                  <div style={{ fontSize:20, marginBottom:3 }}>{ic}</div>
                  <div style={{ fontSize:11, fontWeight:700, lineHeight:1.2 }}>{lbl}</div>
                </button>
              ))}
            </div>

            {/* Description du format */}
            <div style={{ background:"#f0f6ff", borderRadius:9, padding:"10px 13px", marginBottom:16, fontSize:12, color:"#1e4d9e" }}>
              {{ pdf:"🖨️ Ouvre une fenêtre d'impression / génère un PDF via votre navigateur.", html:"🌐 Télécharge un fichier HTML mise en page, ouvrable dans n'importe quel navigateur.", csv:"📊 Format tabulaire compatible Excel et BatApplidevis pour import direct.", json:"🔗 Format structuré pour import dans d'autres logiciels BTP ou API.", txt:"📄 Texte brut simple, idéal pour copier-coller ou archiver.", email:"📧 Prépare un email avec le contenu du document dans votre messagerie." }[fileType]}
            </div>

            {/* Bouton action */}
            <button onClick={() => selected && doShare(selected, shareTab)} style={{ width:"100%", padding:"14px", background:"linear-gradient(135deg,#1e4d9e,#2d6dd4)", border:"none", borderRadius:12, color:"#fff", fontFamily:"inherit", fontSize:15, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:10, boxShadow:"0 4px 14px rgba(30,77,158,.3)" }}>
              <span style={{ fontSize:20 }}>{{ pdf:"🖨️", html:"🌐", csv:"📊", json:"🔗", txt:"📄", email:"📧" }[fileType]}</span>
              {{ pdf:"Imprimer / Enregistrer en PDF", html:"Télécharger HTML", csv:"Télécharger CSV", json:"Télécharger JSON", txt:"Télécharger Texte", email:"Envoyer par email" }[fileType]}
            </button>
          </>)}
        </>)}
      </div>
    </div>
  );
}

// ── STYLES ───────────────────────────────────────────────────
const S = {
  wrap: { fontFamily: "'Outfit', sans-serif", background: "#f0f4fb", minHeight: "100vh", maxWidth: 430, margin: "0 auto", position: "relative", overflowX: "hidden" },
  // header
  header: { background: "linear-gradient(135deg,#0d2347 0%,#1a3a6e 60%,#1e4d9e 100%)", color: "#fff", padding: "14px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100, boxShadow: "0 2px 12px rgba(13,35,71,.25)" },
  logoBox: { display: "flex", alignItems: "center", gap: 10 },
  logoIcon: { width: 36, height: 36, background: "#4a9eff", borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 },
  logoText: { fontSize: 18, fontWeight: 700, letterSpacing: "-0.3px" },
  logoSub: { fontSize: 11, opacity: .7 },
  hBtn: { background: "rgba(255,255,255,.15)", border: "none", color: "#fff", borderRadius: 8, padding: "6px 11px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 500 },
  // nav
  nav: { position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "#fff", borderTop: "1px solid #e2e8f5", display: "flex", zIndex: 200, boxShadow: "0 -4px 20px rgba(13,35,71,.1)" },
  navItem: (active) => ({ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "10px 4px", cursor: "pointer", border: "none", background: "none", color: active ? "#1e4d9e" : "#94a3b8", fontFamily: "inherit", gap: 3 }),
  navIcon: { fontSize: 20 },
  navLabel: { fontSize: 10, fontWeight: 700, letterSpacing: 0.3, textTransform: "uppercase" },
  // screen
  screen: { paddingBottom: 80 },

// ── TOAST HOOK ────────────────────────────────────────────────
function useToast() {
  const [toast, setToast] = useState({ show: false, msg: "", type: "" });
  const show = useCallback((msg, type = "") => {
    setToast({ show: true, msg, type });
    setTimeout(() => setToast(t => ({ ...t, show: false })), 2500);
  }, []);
  return [toast, show];
}

// ── MODAL WRAPPER ─────────────────────────────────────────────
function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div style={S.overlay} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={S.modal}>
        <div style={S.modalHandle} />
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>{title}</span>
          <button style={S.modalClose} onClick={onClose}>✕</button>
        </div>
        <div style={S.modalBody}>{children}</div>
      </div>
    </div>
  );
}

// ── PHOTO CAPTURE ─────────────────────────────────────────────
function PhotoSection({ photos, setPhotos }) {
  const camRef = useRef();
  const galRef = useRef();
  const [viewer, setViewer] = useState(null);

  const handleFiles = (files) => {
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new window.Image();
        img.onload = () => {
          const MAX = 900;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const data = canvas.toDataURL("image/jpeg", 0.78);
          setPhotos(prev => [...prev, { id: genId(), data }]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <button onClick={() => camRef.current.click()} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: "13px 8px", background: "#f0f6ff", border: "2px dashed #4a9eff", borderRadius: 12, cursor: "pointer", color: "#1e4d9e", fontFamily: "inherit", fontSize: 12, fontWeight: 600 }}>
          <span style={{ fontSize: 24 }}>📷</span>Appareil photo
        </button>
        <button onClick={() => galRef.current.click()} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: "13px 8px", background: "#f0f6ff", border: "2px dashed #4a9eff", borderRadius: 12, cursor: "pointer", color: "#1e4d9e", fontFamily: "inherit", fontSize: 12, fontWeight: 600 }}>
          <span style={{ fontSize: 24 }}>🖼️</span>Photothèque
        </button>
      </div>
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={e => handleFiles(e.target.files)} />
      <input ref={galRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={e => handleFiles(e.target.files)} />
      {photos.length > 0 && (
        <div style={S.photoGrid}>
          {photos.map(p => (
            <div key={p.id} style={S.photoThumb}>
              <img src={p.data} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", cursor: "pointer" }} onClick={() => setViewer(p.data)} />
              <button onClick={() => setPhotos(prev => prev.filter(x => x.id !== p.id))} style={{ position: "absolute", top: 4, right: 4, width: 22, height: 22, borderRadius: "50%", background: "rgba(220,38,38,.85)", color: "#fff", border: "none", cursor: "pointer", fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
            </div>
          ))}
        </div>
      )}
      {viewer && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.92)", zIndex: 900, display: "flex", alignItems: "center", justifyContent: "center" }} onClick={() => setViewer(null)}>
          <button onClick={() => setViewer(null)} style={{ position: "absolute", top: 20, right: 20, background: "rgba(255,255,255,.2)", border: "none", color: "#fff", borderRadius: "50%", width: 40, height: 40, fontSize: 20, cursor: "pointer" }}>✕</button>
          <img src={viewer} alt="" style={{ maxWidth: "95vw", maxHeight: "85vh", borderRadius: 10, objectFit: "contain" }} />
        </div>
      )}
    </div>
  );
}

  const crDetail = (() => {

        <div style={S.btnRow}><button style={S.btn("secondary")} onClick={()=>setModal(null)}>Annuler</button><button style={S.btn("primary")} onClick={savePlanning}>✓ Enregistrer</button></div>
      </Modal>

      {/* ── MODAL: SETTINGS ── */}
      <Modal open={modal === "settings"} onClose={() => setModal(null)} title="⚙️ Paramètres">
        <div style={S.sectionHdr}>Votre entreprise</div>
        {[["entreprise","Nom de l'entreprise","SARL Vos Travaux"],["siret","SIRET","123 456 789 00012"],["tel","Téléphone","06 xx xx xx xx"],["email","Email","contact@…"],["adresse","Adresse","Adresse complète"],["prefix","Préfixe devis","DEV-2025-"]].map(([key,lbl,ph]) => (
          <div key={key} style={S.formGroup}><label style={S.label}>{lbl}</label><input style={S.input} placeholder={ph} value={settingsForm[key]||""} onChange={e=>setSettingsForm({...settingsForm,[key]:e.target.value})} /></div>
        ))}
        <div style={S.sectionHdr}>Données</div>
        <button style={{...S.btn("danger"),marginBottom:10}} onClick={() => { if (window.confirm("Effacer TOUTES les données ?")) { const fresh = { clients:[], devis:[], cr:[], planning:[], settings: db.settings }; persist(fresh); setModal(null); showToast("Données effacées"); } }}>🗑️ Effacer toutes les données</button>
        <div style={S.btnRow}><button style={S.btn("secondary")} onClick={()=>setModal(null)}>Fermer</button><button style={S.btn("primary")} onClick={saveSettings}>✓ Sauvegarder</button></div>
      </Modal>

      {/* SCANNER MODAL */}
      {scannerOpen && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(13,35,71,.6)", zIndex: 500, display: "flex", alignItems: "flex-end", justifyContent: "center", backdropFilter: "blur(4px)" }}>
          <div style={{ background: "#0d1f3c", borderRadius: "22px 22px 0 0", width: "100%", maxWidth: 430, maxHeight: "92vh", overflowY: "auto", paddingBottom: 24 }}>
            <div style={{ width: 36, height: 4, background: "rgba(255,255,255,.2)", borderRadius: 2, margin: "12px auto 16px" }} />
            <div style={{ padding: "0 16px" }}>
              <NoteScanner
                clients={db.clients}
                onApplyDevis={applyScannedDevis}
                onApplyCR={applyScannedCR}
                onClose={() => setScannerOpen(false)}
              />
            </div>
          </div>
        </div>
      )}

      {/* DETAIL MODALS */}
      {clientDetail}
      {devisDetail}
      {crDetail}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
