<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16396f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChantiersPro Max">
<title>Chantiers Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1d3a;--blue:#1d4f9a;--sky:#4a9eff;--bg:#f4f7fc;--card:#fff;--line:#dce6f4;--muted:#607590;--text:#16243c;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--green:#15803d;--r:16px;--shadow:0 10px 30px rgba(13,35,71,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Outfit,system-ui,-apple-system,sans-serif;color:var(--text);max-width:460px;min-height:100vh;margin-inline:auto;box-shadow:0 0 0 1px #e6edf7}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}textarea{resize:vertical}.page{display:none;min-height:100vh;padding-bottom:92px}.page.active{display:block}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(11,29,58,.25)}.back,.ghost{background:rgba(255,255,255,.14);color:#fff;border-radius:11px;padding:8px 12px;font-weight:700}.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#07182f,#173c76 62%,#1d5fbd);color:#fff;padding:26px 18px 28px}.hero:before{content:"";position:absolute;right:-45px;top:-70px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:rgba(74,158,255,.25);display:grid;place-items:center;font-size:23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:21px}.stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 6px;text-align:center}.stat b{font-size:23px}.stat span{display:block;font-size:10px;opacity:.72;text-transform:uppercase;letter-spacing:.45px;margin-top:2px}.section{padding:18px 18px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;color:var(--muted)}.nav{display:flex;flex-direction:column;gap:9px;padding:0 16px}.row{display:flex;align-items:center;gap:13px;padding:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:0 1px 8px rgba(13,35,71,.05)}.row:active,.card:active{transform:scale(.99)}.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}.grow{flex:1}.title{font-size:15px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:2px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:#eaf2ff;color:var(--blue)}.dark{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0}.dark .sub{color:rgba(255,255,255,.65)}.green{background:linear-gradient(135deg,#052e16,#166534);color:#fff;border:0}.green .sub{color:rgba(255,255,255,.66)}.toolbar{position:sticky;top:61px;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}.search{width:100%;border:1.5px solid var(--line);background:#f7faff;border-radius:12px;padding:11px 13px;outline:none}.search:focus,.inp:focus,.sel:focus,.ta:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(74,158,255,.12);background:#fff}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:8}.tab{white-space:nowrap;padding:8px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--muted);font-weight:800}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.list{padding:13px 16px;display:flex;flex-direction:column;gap:10px}.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(13,35,71,.06)}.between{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.avatar{width:47px;height:47px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--sky));color:white;display:grid;place-items:center;font-weight:900;font-size:18px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;color:var(--muted);font-size:12px}.amt{color:var(--blue);font-weight:900;font-size:17px}.fab{position:fixed;right:calc(50% - 214px);bottom:22px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--sky));color:white;font-size:30px;box-shadow:0 10px 28px rgba(30,79,154,.35);z-index:20}@media(max-width:460px){.fab{right:18px}}.empty{text-align:center;padding:48px 22px;color:var(--muted)}.empty div{font-size:42px;opacity:.45;margin-bottom:10px}.modal-bg{display:none;position:fixed;inset:0;background:rgba(7,24,47,.58);z-index:50;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}.modal-bg.active{display:flex}.modal{width:100%;max-width:460px;max-height:94vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--shadow)}.handle{width:42px;height:4px;background:#c9d6e8;border-radius:999px;margin:12px auto}.mh{position:sticky;top:0;background:#fff;z-index:2;padding:10px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.close{width:34px;height:34px;border-radius:50%;background:#edf3fb;color:var(--muted);font-weight:900}.mb{padding:16px 18px 26px}.sh{display:inline-block;background:var(--blue);color:#fff;border-radius:9px;padding:6px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.65px;font-weight:900;margin:13px 0 11px}.sh.g{background:var(--green)}.fg{margin-bottom:12px}.lbl{display:block;font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.45px;margin-bottom:5px}.inp,.sel,.ta{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:10px;margin-top:16px}.btn{flex:1;padding:12px;border-radius:12px;font-weight:900}.primary{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}.secondary{background:#edf3fb;color:var(--muted)}.danger{background:#fee2e2;color:var(--bad)}.ok{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff}.table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:13px}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:#edf6ff;color:var(--blue);padding:8px 5px;text-align:left;font-size:10px;text-transform:uppercase}.tbl td{padding:6px 5px;border-top:1px solid #eef3fa}.ti{width:100%;min-width:70px;border:0;background:transparent;outline:none;padding:5px;border-radius:6px}.ti:focus{background:#edf6ff}.sum{background:#edf6ff;border-radius:13px;padding:13px;margin-top:12px}.sum p{display:flex;justify-content:space-between;margin:5px 0}.sum .total{border-top:1px solid #cbdcf2;padding-top:9px;margin-top:9px;font-weight:900;font-size:17px}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);background:#15243a;color:white;border-radius:999px;padding:10px 18px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{background:var(--ok)}.toast.err{background:var(--bad)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:13px 16px 6px}.day{background:#fff;border:1.5px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px}.day.active{background:var(--blue);color:#fff}.day b{display:block}.day span{font-size:9px;text-transform:uppercase;font-weight:900;opacity:.7}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{aspect-ratio:1;border-radius:12px;background:#edf3fb;border:1.5px dashed #b9c8dc;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.print-doc{font-family:Arial,sans-serif;color:#111}.print-doc h1{color:#173c76}.kbd{background:#eef4fc;border:1px solid #d8e4f3;border-radius:7px;padding:2px 6px;font-size:11px;font-weight:800;color:#44627f}
@media print{body{max-width:none;background:#fff;box-shadow:none}.page,.toast,.fab,.modal-bg,.top,.toolbar,.tabs,.hero,.section,.nav{display:none!important}#print-area{display:block!important}.print-doc{padding:20mm}}
</style>
</head>
<body>
<div id="toast" class="toast"></div><div id="print-area" style="display:none"></div>
<section id="home" class="page active"><div class="hero"><div class="brand"><div class="logo">🏗️</div><div><div style="font-size:20px;font-weight:900">Chantiers Pro</div><div style="opacity:.7;font-size:12px">Devis, prospects, planning et exports BTP</div></div><button class="ghost" style="margin-left:auto" data-action="settings">⚙️</button></div><div class="stats"><div class="stat"><b id="st-clients">0</b><span>Clients</span></div><div class="stat"><b id="st-devis">0</b><span>Devis</span></div><div class="stat"><b id="st-ca">0 €</b><span>CA signé</span></div></div></div><div class="section">Menu principal</div><div class="nav"><button class="row" data-page="clients"><div class="ic" style="background:#dbeafe">👤</div><div class="grow"><div class="title">Clients</div><div class="sub">Fiches clients et coordonnées</div></div><span class="badge" id="b-clients">0</span>›</button><button class="row" data-page="devis"><div class="ic" style="background:#dcfce7">📋</div><div class="grow"><div class="title">Devis</div><div class="sub">Chiffrage, TVA et statuts</div></div><span class="badge" id="b-devis">0</span>›</button><button class="row" data-page="visites"><div class="ic" style="background:#fef3c7">🔍</div><div class="grow"><div class="title">Visites prospects</div><div class="sub">Notes terrain, contraintes, budget</div></div><span class="badge" id="b-visites">0</span>›</button><button class="row" data-page="planning"><div class="ic" style="background:#fee2e2">📅</div><div class="grow"><div class="title">Planning</div><div class="sub">Interventions et rendez-vous</div></div><span class="badge" id="b-plan">0</span>›</button><button class="row dark" data-page="exports"><div class="ic" style="background:rgba(255,255,255,.13)">📤</div><div class="grow"><div class="title">Partager & Export</div><div class="sub">PDF imprimable, JSON, CSV, sauvegarde</div></div>›</button><button class="row green" data-action="scanner"><div class="ic" style="background:rgba(255,255,255,.13)">✨</div><div class="grow"><div class="title">Assistant devis IA local</div><div class="sub">Transforme une note texte en lignes de devis</div></div>›</button></div><div class="section">Devis récents</div><div id="home-devis" class="list"></div></section>
<section id="clients" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>👤 Clients</b><span></span></header><div class="toolbar"><input id="q-clients" class="search" placeholder="Rechercher un client, une ville…"></div><div id="list-clients" class="list"></div><button class="fab" data-action="new-client">+</button></section>
<section id="devis" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>📋 Devis</b><span></span></header><div class="tabs" id="devis-tabs"><button class="tab active" data-filter="tous">Tous</button><button class="tab" data-filter="brouillon">Brouillon</button><button class="tab" data-filter="envoyé">Envoyés</button><button class="tab" data-filter="signé">Signés</button><button class="tab" data-filter="refusé">Refusés</button></div><div id="list-devis" class="list"></div><button class="fab" data-action="new-devis">+</button></section>
<section id="visites" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>🔍 Visites prospects</b><span></span></header><div class="toolbar"><input id="q-visites" class="search" placeholder="Rechercher une visite…"></div><div id="list-visites" class="list"></div><button class="fab" data-action="new-visite">+</button></section>
<section id="planning" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>📅 Planning</b><span></span></header><div id="week" class="week"></div><div style="padding:8px 16px;display:flex;justify-content:space-between;align-items:center"><b id="plan-label">Aujourd'hui</b><button class="badge" data-action="new-plan">+ Ajouter</button></div><div id="list-plan" class="list"></div></section>
<section id="exports" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>📤 Export</b><span></span></header><div class="list"><div class="card"><div class="title">Documents</div><div class="sub">Sélectionne un devis ou une visite depuis sa fiche pour imprimer/exporter.</div></div><button class="row" data-action="export-json"><div class="ic" style="background:#eaf2ff">💾</div><div class="grow"><div class="title">Sauvegarde complète JSON</div><div class="sub">Clients, devis, visites, planning, paramètres</div></div>↓</button><button class="row" data-action="export-clients"><div class="ic" style="background:#dcfce7">👥</div><div class="grow"><div class="title">Export clients CSV</div><div class="sub">Compatible Excel / Numbers</div></div>↓</button><button class="row" data-action="export-devis"><div class="ic" style="background:#fef3c7">📋</div><div class="grow"><div class="title">Export devis CSV</div><div class="sub">Suivi CA et statuts</div></div>↓</button><label class="row"><div class="ic" style="background:#fee2e2">📂</div><div class="grow"><div class="title">Importer une sauvegarde</div><div class="sub">Fichier JSON ChantiersPro Max</div></div><input id="import-file" type="file" accept=".json,application/json" hidden></label><button class="row" data-action="demo"><div class="ic" style="background:#e9d5ff">🧪</div><div class="grow"><div class="title">Charger des données de démonstration</div><div class="sub">Utile pour tester l'application rapidement</div></div>+</button></div></section>
<div id="modal-root"></div>
<script>
(()=>{'use strict';
const KEY='chantierspro_max_v1';let DB=load(),currentFilter='tous',selectedDate=today();
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function today(){return new Date().toISOString().slice(0,10)}function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function seed(){return{clients:[],devis:[],visites:[],planning:[],settings:{entreprise:'',siret:'',tel:'',email:'',adresse:'',prefix:'DEV-'+new Date().getFullYear()+'-',nextNum:1}}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));renderAll()}function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function money(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function fmt(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR')}function cname(c){return [c?.prenom,c?.nom].filter(Boolean).join(' ')||c?.societe||'Client sans nom'}function client(id){return DB.clients.find(c=>c.id===id)}
function toast(m,t=''){const el=$('#toast');el.textContent=m;el.className='toast show '+t;setTimeout(()=>el.className='toast',2300)}
function go(id){$$('.page').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');scrollTo(0,0);renderAll()}
function renderAll(){renderHome();renderClients();renderDevis();renderVisites();renderWeek();renderPlan()}
function renderHome(){const ca=DB.devis.filter(d=>d.statut==='signé').reduce((s,d)=>s+(d.totalTTC||0),0);$('#st-clients').textContent=DB.clients.length;$('#st-devis').textContent=DB.devis.length;$('#st-ca').textContent=ca>999?Math.round(ca/100)/10+' k€':Math.round(ca)+' €';$('#b-clients').textContent=DB.clients.length;$('#b-devis').textContent=DB.devis.length;$('#b-visites').textContent=DB.visites.length;$('#b-plan').textContent=DB.planning.filter(p=>p.dateFin>=today()).length;const box=$('#home-devis');if(!DB.devis.length){box.innerHTML='<div class="empty"><div>📋</div>Aucun devis pour le moment</div>';return}box.innerHTML=DB.devis.slice(0,3).map(devisCard).join('')}
function renderClients(){const q=($('#q-clients')?.value||'').toLowerCase();const items=DB.clients.filter(c=>(cname(c)+' '+c.ville+' '+c.societe).toLowerCase().includes(q));$('#list-clients').innerHTML=items.length?items.map(c=>`<article class="card" data-open-client="${c.id}"><div class="between"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${esc(cname(c)[0]||'?')}</div><div><div class="title">${esc(cname(c))}</div><div class="sub">${esc(c.societe||c.type||'Particulier')}</div></div></div><span class="badge">${DB.devis.filter(d=>d.clientId===c.id).length} devis</span></div><div class="meta">${c.tel?`<span>📞 ${esc(c.tel)}</span>`:''}${c.email?`<span>✉️ ${esc(c.email)}</span>`:''}${c.ville?`<span>📍 ${esc(c.ville)}</span>`:''}</div></article>`).join(''):'<div class="empty"><div>👥</div>Aucun client trouvé</div>'}
function devisCard(d){const c=client(d.clientId);const cls={brouillon:'',envoyé:'',signé:' style="background:#dcfce7;color:#15803d"',refusé:' style="background:#fee2e2;color:#dc2626"'}[d.statut]||'';return`<article class="card" data-open-devis="${d.id}"><div class="between"><div><div class="title">${esc(d.numero)} ${d.isBio?'🌿':''} ${d.hourly?.enabled?'⏱️':''}</div><div class="sub">${esc(c?cname(c):'Sans client')} · ${esc(d.objet||'Sans objet')}</div></div><div style="text-align:right"><div class="amt">${money(d.totalTTC)}</div><span class="badge"${cls}>${esc(d.statut)}</span></div></div><div class="meta"><span>📅 ${fmt(d.date)}</span><span>TVA ${d.tva||0}%</span></div></article>`}
function renderDevis(){const list=currentFilter==='tous'?DB.devis:DB.devis.filter(d=>d.statut===currentFilter);$('#list-devis').innerHTML=list.length?list.map(devisCard).join(''):'<div class="empty"><div>📋</div>Aucun devis dans cette catégorie</div>'}
function renderVisites(){const q=($('#q-visites')?.value||'').toLowerCase();const arr=DB.visites.filter(v=>{const c=client(v.clientId);return (cname(c)+' '+v.nature+' '+v.adresse+' '+v.travaux).toLowerCase().includes(q)});$('#list-visites').innerHTML=arr.length?arr.map(v=>{const c=client(v.clientId);return`<article class="card" data-open-visite="${v.id}"><div class="between"><div><div class="title">${esc(c?cname(c):'Prospect')}</div><div class="sub">${esc(v.nature||'Visite')} · ${fmt(v.date)}</div></div><span class="badge">${esc(v.proba||'moyenne')}</span></div><div class="meta"><span>📍 ${esc(v.adresse||'Adresse non renseignée')}</span>${v.budget?`<span>💶 ${money(v.budget)}</span>`:''} ${v.photos?.length?`<span>📸 ${v.photos.length} photo${v.photos.length>1?'s':''}</span>`:''}</div></article>`}).join(''):'<div class="empty"><div>🔍</div>Aucune visite</div>'}
function renderWeek(){const base=new Date(selectedDate+'T12:00:00'),start=new Date(base);start.setDate(base.getDate()-((base.getDay()+6)%7));$('#week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);return`<button class="day ${iso===selectedDate?'active':''}" data-date="${iso}"><span>${d.toLocaleDateString('fr-FR',{weekday:'short'}).slice(0,3)}</span><b>${d.getDate()}</b></button>`}).join('');$('#plan-label').textContent=selectedDate===today()?"Aujourd'hui":fmt(selectedDate)}
function renderPlan(){const arr=DB.planning.filter(p=>selectedDate>=p.dateDebut&&selectedDate<=p.dateFin);$('#list-plan').innerHTML=arr.length?arr.map(p=>`<article class="card" data-open-plan="${p.id}"><div class="between"><div><div class="title">${esc(p.titre)}</div><div class="sub">${esc(p.type||'Intervention')} · ${esc(p.heureDebut||'08:00')}–${esc(p.heureFin||'17:00')}</div></div><span class="badge">${esc(client(p.clientId)?cname(client(p.clientId)):'—')}</span></div><div class="meta"><span>📍 ${esc(p.adresse||'Adresse non renseignée')}</span>${p.intervenants?`<span>👷 ${esc(p.intervenants)}</span>`:''}</div></article>`).join(''):'<div class="empty"><div>📅</div>Rien de prévu ce jour</div>'}
function modal(title,body){$('#modal-root').innerHTML=`<div class="modal-bg active"><div class="modal"><div class="handle"></div><div class="mh"><b>${title}</b><button class="close" data-close>✕</button></div><div class="mb">${body}</div></div></div>`}
function closeModal(){ $('#modal-root').innerHTML='' }
function clientOptions(sel=''){return '<option value="">— Sélectionner —</option>'+DB.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(cname(c))}</option>`).join('')}
function openClient(id){const c=id?client(id):{};modal(id?'Modifier client':'Nouveau client',`<span class="sh">Identité</span><div class="grid2"><div class="fg"><label class="lbl">Prénom</label><input class="inp" id="f-prenom" value="${esc(c.prenom||'')}"></div><div class="fg"><label class="lbl">Nom</label><input class="inp" id="f-nom" value="${esc(c.nom||'')}"></div></div><div class="fg"><label class="lbl">Société</label><input class="inp" id="f-societe" value="${esc(c.societe||'')}"></div><div class="fg"><label class="lbl">Type</label><select class="sel" id="f-type">${['particulier','professionnel','syndic','promoteur'].map(x=>`<option ${c.type===x?'selected':''}>${x}</option>`).join('')}</select></div><span class="sh">Coordonnées</span><div class="fg"><label class="lbl">Téléphone</label><input class="inp" id="f-tel" value="${esc(c.tel||'')}"></div><div class="fg"><label class="lbl">Email</label><input class="inp" id="f-email" value="${esc(c.email||'')}"></div><div class="fg"><label class="lbl">Adresse</label><input class="inp" id="f-adresse" value="${esc(c.adresse||'')}"></div><div class="grid2"><div class="fg"><label class="lbl">Code postal</label><input class="inp" id="f-cp" value="${esc(c.cp||'')}"></div><div class="fg"><label class="lbl">Ville</label><input class="inp" id="f-ville" value="${esc(c.ville||'')}"></div></div><div class="fg"><label class="lbl">Notes</label><textarea class="ta" id="f-notes">${esc(c.notes||'')}</textarea></div><div class="btns">${id?'<button class="btn danger" data-delete-client="'+id+'">Supprimer</button>':''}<button class="btn secondary" data-close>Annuler</button><button class="btn primary" data-save-client="${id||''}">Enregistrer</button></div>`)}
function openDevis(id){const d=id?DB.devis.find(x=>x.id===id):{numero:DB.settings.prefix+String(DB.settings.nextNum).padStart(4,'0'),date:today(),valid:30,statut:'brouillon',tva:10,lignes:[{designation:'',unite:'u',qte:1,pu:0}],mo:0,dep:0,hourly:{enabled:false,taux:45,heures:0,contrainte:25,fournitures:0,marge:0}};const h=d.hourly||{};modal(id?'Modifier devis':'Nouveau devis',`<button class="row dark" style="width:100%;margin-bottom:12px" data-action="ai-fill"><div class="ic">✨</div><div class="grow"><div class="title">Assistant IA local</div><div class="sub">Générer des lignes depuis une description</div></div></button><span class="sh">Informations</span><div class="fg"><label class="lbl">Numéro</label><input class="inp" id="d-numero" value="${esc(d.numero)}"></div><div class="fg"><label class="lbl">Client</label><select class="sel" id="d-client">${clientOptions(d.clientId)}</select></div><div class="fg"><label class="lbl">Objet</label><input class="inp" id="d-objet" value="${esc(d.objet||'')}"></div><div class="grid2"><div class="fg"><label class="lbl">Date</label><input class="inp" id="d-date" type="date" value="${esc(d.date)}"></div><div class="fg"><label class="lbl">Validité</label><input class="inp" id="d-valid" type="number" value="${esc(d.valid||30)}"></div></div><div class="fg"><label class="lbl">Statut</label><select class="sel" id="d-statut">${['brouillon','envoyé','signé','refusé'].map(s=>`<option ${d.statut===s?'selected':''}>${s}</option>`).join('')}</select></div><label class="row" style="margin-bottom:12px"><input type="checkbox" id="d-bio" ${d.isBio?'checked':''}><div><div class="title">🌿 Devis biosourcé</div><div class="sub">Ajoute une mention matériaux écologiques / AT / règles pro</div></div></label><label class="row" style="margin-bottom:12px;background:#fff8ed;border-color:#fed7aa"><input type="checkbox" id="d-hourly" ${h.enabled?'checked':''}><div><div class="title">⏱️ Chantier contraint / au temps passé</div><div class="sub">Pour petits chantiers, accès difficile, attente, manutention ou imprévus</div></div></label><div id="hourly-panel" style="display:${h.enabled?'block':'none'};background:#fff7ed;border:1.5px solid #fed7aa;border-radius:14px;padding:13px;margin-bottom:12px"><div class="sub" style="color:#9a3412;margin-bottom:10px"><b>Mode horaire :</b> le devis intègre le temps perdu lié aux contraintes du chantier.</div><div class="grid2"><div class="fg"><label class="lbl">Taux horaire HT</label><input class="inp" id="h-taux" type="number" value="${h.taux??45}"></div><div class="fg"><label class="lbl">Heures estimées</label><input class="inp" id="h-heures" type="number" step="0.5" value="${h.heures??0}"></div></div><div class="grid2"><div class="fg"><label class="lbl">Contrainte / temps perdu</label><select class="sel" id="h-contrainte">${[[0,'Normal +0%'],[15,'Contraintes légères +15%'],[25,'Contraintes fortes +25%'],[40,'Très contraignant +40%']].map(a=>`<option value="${a[0]}" ${Number(h.contrainte??25)===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="fg"><label class="lbl">Petites fournitures HT</label><input class="inp" id="h-fournitures" type="number" value="${h.fournitures??0}"></div></div><div class="fg"><label class="lbl">Marge sécurité (%)</label><input class="inp" id="h-marge" type="number" value="${h.marge??0}"></div></div><span class="sh">Lignes classiques</span><div class="table-wrap"><table class="tbl"><thead><tr><th>Désignation</th><th>Unité</th><th>Qté</th><th>P.U. HT</th><th></th></tr></thead><tbody id="d-lines">${(d.lignes||[]).map(lineRow).join('')}</tbody></table></div><button class="btn secondary" style="width:100%;margin-top:8px" data-add-line>+ Ajouter une ligne</button><div class="grid2" style="margin-top:12px"><div class="fg"><label class="lbl">Main d'œuvre HT classique</label><input class="inp" id="d-mo" type="number" value="${d.mo||0}"></div><div class="fg"><label class="lbl">Déplacement HT</label><input class="inp" id="d-dep" type="number" value="${d.dep||0}"></div></div><div class="fg"><label class="lbl">TVA</label><select class="sel" id="d-tva">${[0,5.5,10,20].map(t=>`<option value="${t}" ${Number(d.tva)===t?'selected':''}>${String(t).replace('.',',')}%</option>`).join('')}</select></div><div class="sum" id="d-sum"></div><div class="fg"><label class="lbl">Remarques</label><textarea class="ta" id="d-rem">${esc(d.rem||'')}</textarea></div><div class="btns">${id?'<button class="btn danger" data-delete-devis="'+id+'">Supprimer</button><button class="btn ok" data-print-devis="'+id+'">PDF</button>':''}<button class="btn secondary" data-close>Annuler</button><button class="btn primary" data-save-devis="${id||''}">Enregistrer</button></div>`);calcDraft()}
function lineRow(l={designation:'',unite:'u',qte:1,pu:0}){return`<tr><td><input class="ti dl-designation" value="${esc(l.designation)}" placeholder="Ouvrage"></td><td><input class="ti dl-unite" value="${esc(l.unite||'u')}"></td><td><input class="ti dl-qte" type="number" value="${Number(l.qte)||0}"></td><td><input class="ti dl-pu" type="number" value="${Number(l.pu)||0}"></td><td><button class="badge" data-remove-line>×</button></td></tr>`}
function getDraftLines(){return $$('#d-lines tr').map(tr=>({designation:tr.querySelector('.dl-designation').value.trim(),unite:tr.querySelector('.dl-unite').value.trim()||'u',qte:Number(tr.querySelector('.dl-qte').value)||0,pu:Number(tr.querySelector('.dl-pu').value)||0})).filter(l=>l.designation||l.qte||l.pu)}
function hourlyValues(){const enabled=!!$('#d-hourly')?.checked;return{enabled,taux:Number($('#h-taux')?.value)||0,heures:Number($('#h-heures')?.value)||0,contrainte:Number($('#h-contrainte')?.value)||0,fournitures:Number($('#h-fournitures')?.value)||0,marge:Number($('#h-marge')?.value)||0}}
function hourlyCalc(h,dep=0){const base=h.heures*h.taux,perdu=base*h.contrainte/100,sous=base+perdu+dep+h.fournitures,marge=sous*h.marge/100;return{base,perdu,marge,total:sous+marge}}
function updateHourlyPanel(){const p=$('#hourly-panel'),cb=$('#d-hourly'),mo=$('#d-mo');if(p&&cb)p.style.display=cb.checked?'block':'none';if(mo&&cb)mo.disabled=cb.checked}
function calcDraft(){if(!$('#d-sum'))return;updateHourlyPanel();const lignesTotal=getDraftLines().reduce((s,l)=>s+l.qte*l.pu,0),dep=Number($('#d-dep').value)||0,h=hourlyValues();let details='',ht=0;if(h.enabled){const hc=hourlyCalc(h,dep);ht=lignesTotal+hc.total;details=`<p><span>Lignes classiques</span><b>${money(lignesTotal)}</b></p><p><span>Main-d'œuvre horaire</span><b>${money(hc.base)}</b></p><p><span>Temps perdu / contraintes ${h.contrainte}%</span><b>${money(hc.perdu)}</b></p><p><span>Déplacement</span><b>${money(dep)}</b></p><p><span>Petites fournitures</span><b>${money(h.fournitures)}</b></p>${h.marge?`<p><span>Marge sécurité ${h.marge}%</span><b>${money(hc.marge)}</b></p>`:''}`}else{ht=lignesTotal+(Number($('#d-mo').value)||0)+dep;details=`<p><span>Lignes</span><b>${money(lignesTotal)}</b></p><p><span>Main-d'œuvre</span><b>${money(Number($('#d-mo').value)||0)}</b></p><p><span>Déplacement</span><b>${money(dep)}</b></p>`}const tva=Number($('#d-tva').value)||0,ttc=ht*(1+tva/100);$('#d-sum').innerHTML=`${details}<p><span>Total HT</span><b>${money(ht)}</b></p><p><span>TVA</span><b>${money(ttc-ht)}</b></p><p class="total"><span>Total TTC</span><b>${money(ttc)}</b></p>`}
function saveDevis(id){const lignes=getDraftLines(),h=hourlyValues();if(!$('#d-objet').value.trim()){toast('Objet du devis obligatoire','err');return}if(!h.enabled&&!lignes.length){toast('Ajoute au moins une ligne de devis','err');return}if(h.enabled&&(!h.heures||!h.taux)){toast('Renseigne les heures et le taux horaire','err');return}const lignesTotal=lignes.reduce((s,l)=>s+l.qte*l.pu,0),dep=Number($('#d-dep').value)||0,hc=hourlyCalc(h,dep);const ht=h.enabled?lignesTotal+hc.total:lignesTotal+(Number($('#d-mo').value)||0)+dep,tva=Number($('#d-tva').value)||0,obj={id:id||gid(),numero:$('#d-numero').value.trim(),clientId:$('#d-client').value,objet:$('#d-objet').value.trim(),date:$('#d-date').value,valid:Number($('#d-valid').value)||30,statut:$('#d-statut').value,tva,lignes,mo:h.enabled?0:(Number($('#d-mo').value)||0),dep,totalHT:ht,totalTTC:ht*(1+tva/100),rem:$('#d-rem').value.trim(),isBio:$('#d-bio').checked,hourly:h};if(h.enabled&&!obj.rem)obj.rem='Intervention estimée au temps passé en raison des contraintes du chantier. Le montant pourra être ajusté selon le temps réellement nécessaire après accord du client.';if(id){DB.devis=DB.devis.map(d=>d.id===id?obj:d)}else{DB.devis.unshift(obj);DB.settings.nextNum++}save();closeModal();toast('Devis enregistré','ok')}
function openVisite(id){vtPhotos=[];const v=id?DB.visites.find(x=>x.id===id):{date:today(),proba:'moyenne'};modal(id?'Modifier visite':'Nouvelle visite',`<span class="sh g">Prospect</span><div class="fg"><label class="lbl">Client / prospect</label><select class="sel" id="v-client">${clientOptions(v.clientId)}</select></div><div class="fg"><label class="lbl">Adresse chantier</label><input class="inp" id="v-adresse" value="${esc(v.adresse||'')}"></div><div class="grid2"><div class="fg"><label class="lbl">Date</label><input class="inp" id="v-date" type="date" value="${esc(v.date)}"></div><div class="fg"><label class="lbl">Heure</label><input class="inp" id="v-heure" type="time" value="${esc(v.heure||'09:00')}"></div></div><div class="fg"><label class="lbl">Nature</label><select class="sel" id="v-nature">${['Rénovation intérieure','Gros œuvre / Extension','Plomberie','Électricité','Peinture / Revêtements','Menuiserie','Isolation / Thermique','Toiture / Couverture','Aménagement extérieur','Construction neuve','Autre'].map(x=>`<option ${v.nature===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fg"><label class="lbl">Probabilité</label><select class="sel" id="v-proba">${['faible','moyenne','forte','certaine'].map(x=>`<option ${v.proba===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fg"><label class="lbl">État des lieux</label><textarea class="ta" id="v-etat">${esc(v.etat||'')}</textarea></div><div class="fg"><label class="lbl">Travaux à chiffrer</label><textarea class="ta" id="v-travaux">${esc(v.travaux||'')}</textarea></div><div class="fg"><label class="lbl">Contraintes</label><textarea class="ta" id="v-contraintes">${esc(v.contraintes||'')}</textarea></div><div class="grid2"><div class="fg"><label class="lbl">Budget client</label><input class="inp" id="v-budget" type="number" value="${esc(v.budget||'')}"></div><div class="fg"><label class="lbl">Délai souhaité</label><input class="inp" id="v-delai" value="${esc(v.delai||'')}"></div></div><span class=\"sh g\">📸 Photos du site</span><div style=\"display:flex;gap:8px;margin-bottom:8px\"><button onclick=\"document.getElementById('vt-cam2').click()\" style=\"flex:1;padding:10px;background:#f0f9ff;border:2px dashed #4a9eff;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;color:#1e4d9e\">📷 Photo</button><button onclick=\"document.getElementById('vt-gal2').click()\" style=\"flex:1;padding:10px;background:#f0f9ff;border:2px dashed #4a9eff;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;color:#1e4d9e\">🖼️ Galerie</button></div><input type=\"file\" id=\"vt-cam2\" accept=\"image/*\" capture=\"environment\" style=\"display:none\" onchange=\"addVtPhotos(this.files)\"><input type=\"file\" id=\"vt-gal2\" accept=\"image/*\" multiple style=\"display:none\" onchange=\"addVtPhotos(this.files)\"><div id=\"vt-photo-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px\"></div><div class="btns">${id?'<button class="btn danger" data-delete-visite="'+id+'">Supprimer</button><button class="btn ok" data-print-visite="'+id+'">PDF</button>':''}<button class="btn secondary" data-close>Annuler</button><button class="btn primary" data-save-visite="${id||''}">Enregistrer</button></div>`)}
function saveVisite(id){const obj={id:id||gid(),clientId:$('#v-client').value,adresse:$('#v-adresse').value.trim(),date:$('#v-date').value,heure:$('#v-heure').value,nature:$('#v-nature').value,proba:$('#v-proba').value,etat:$('#v-etat').value.trim(),travaux:$('#v-travaux').value.trim(),contraintes:$('#v-contraintes').value.trim(),budget:Number($('#v-budget').value)||0,delai:$('#v-delai').value.trim()};obj.photos=JSON.parse(JSON.stringify(vtPhotos));if(!obj.adresse&&!obj.travaux){toast('Renseigne une adresse ou des travaux','err');return}if(id)DB.visites=DB.visites.map(v=>v.id===id?obj:v);else DB.visites.unshift(obj);save();closeModal();toast('Visite enregistrée','ok')}
function openPlan(id){const p=id?DB.planning.find(x=>x.id===id):{dateDebut:selectedDate,dateFin:selectedDate,heureDebut:'08:00',heureFin:'17:00'};modal(id?'Modifier planning':'Planifier',`<div class="fg"><label class="lbl">Client</label><select class="sel" id="p-client">${clientOptions(p.clientId)}</select></div><div class="fg"><label class="lbl">Titre</label><input class="inp" id="p-titre" value="${esc(p.titre||'')}"></div><div class="fg"><label class="lbl">Adresse</label><input class="inp" id="p-adresse" value="${esc(p.adresse||'')}"></div><div class="grid2"><div class="fg"><label class="lbl">Date début</label><input class="inp" id="p-dd" type="date" value="${esc(p.dateDebut)}"></div><div class="fg"><label class="lbl">Date fin</label><input class="inp" id="p-df" type="date" value="${esc(p.dateFin)}"></div></div><div class="grid2"><div class="fg"><label class="lbl">Heure début</label><input class="inp" id="p-hd" type="time" value="${esc(p.heureDebut)}"></div><div class="fg"><label class="lbl">Heure fin</label><input class="inp" id="p-hf" type="time" value="${esc(p.heureFin)}"></div></div><div class="fg"><label class="lbl">Type</label><select class="sel" id="p-type">${['Travaux en cours','Visite prospect','Livraison matériaux','Réunion de chantier','Expertise / Diagnostic','Réception travaux'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fg"><label class="lbl">Intervenants</label><input class="inp" id="p-int" value="${esc(p.intervenants||'')}"></div><div class="fg"><label class="lbl">Notes</label><textarea class="ta" id="p-notes">${esc(p.notes||'')}</textarea></div><div class="btns">${id?'<button class="btn danger" data-delete-plan="'+id+'">Supprimer</button>':''}<button class="btn secondary" data-close>Annuler</button><button class="btn primary" data-save-plan="${id||''}">Enregistrer</button></div>`)}
function savePlan(id){const obj={id:id||gid(),clientId:$('#p-client').value,titre:$('#p-titre').value.trim(),adresse:$('#p-adresse').value.trim(),dateDebut:$('#p-dd').value,dateFin:$('#p-df').value,heureDebut:$('#p-hd').value,heureFin:$('#p-hf').value,type:$('#p-type').value,intervenants:$('#p-int').value.trim(),notes:$('#p-notes').value.trim()};if(!obj.titre){toast('Titre obligatoire','err');return}if(obj.dateFin<obj.dateDebut)obj.dateFin=obj.dateDebut;if(id)DB.planning=DB.planning.map(p=>p.id===id?obj:p);else DB.planning.unshift(obj);save();closeModal();toast('Planning enregistré','ok')}
function openSettings(){const s=DB.settings;modal('Paramètres',`<span class="sh">Entreprise</span><div class="fg"><label class="lbl">Nom</label><input class="inp" id="s-entreprise" value="${esc(s.entreprise)}"></div><div class="fg"><label class="lbl">SIRET</label><input class="inp" id="s-siret" value="${esc(s.siret)}"></div><div class="grid2"><div class="fg"><label class="lbl">Téléphone</label><input class="inp" id="s-tel" value="${esc(s.tel)}"></div><div class="fg"><label class="lbl">Email</label><input class="inp" id="s-email" value="${esc(s.email)}"></div></div><div class="fg"><label class="lbl">Adresse</label><input class="inp" id="s-adresse" value="${esc(s.adresse)}"></div><div class="fg"><label class="lbl">Préfixe devis</label><input class="inp" id="s-prefix" value="${esc(s.prefix)}"></div><div class="btns"><button class="btn danger" data-wipe>Réinitialiser</button><button class="btn secondary" data-close>Fermer</button><button class="btn primary" data-save-settings>Sauvegarder</button></div>`)}

function aiGenerate(){const txt=$('#ai-text').value.toLowerCase(),bio=$('#ai-bio').checked;let lines=[];const add=(designation,unite,qte,pu)=>lines.push({designation,unite,qte,pu});const surf=(txt.match(/(\d+[,.]?\d*)\s?m[²2]/)||[])[1];const q=Number(String(surf||20).replace(',','.'))||20;if(txt.includes('isolation')){add((bio?'Isolation biosourcée ':'Isolation ')+'fourniture et pose', 'm²', q, bio?64:48);add('Protection, préparation et nettoyage', 'forfait', 1, 180)}else if(txt.includes('carrelage')){add('Préparation support et ragréage ponctuel','m²',q,18);add('Fourniture et pose carrelage','m²',q,58);add('Joints et finitions','m²',q,8)}else if(txt.includes('peinture')){add('Préparation supports','m²',q,12);add('Application peinture deux couches','m²',q,24)}else{add('Préparation et installation chantier','forfait',1,250);add('Travaux selon descriptif client','forfait',1,1200);add('Nettoyage et évacuation','forfait',1,180)}if(bio)add('Note biosourcée : matériaux sous AT ou règles professionnelles','forfait',1,0);$('#ai-out').innerHTML=`<div class="sum"><b>Proposition générée</b>${lines.map(l=>`<p><span>${esc(l.designation)} · ${l.qte} ${l.unite}</span><b>${money(l.qte*l.pu)}</b></p>`).join('')}</div><button class="btn ok" style="width:100%;margin-top:10px" data-ai-create='${esc(JSON.stringify(lines))}'>Créer un devis avec ces lignes</button>`}

async function claudeAPI(system,userMsg,imageB64){
  const content=imageB64?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:imageB64}},{type:'text',text:userMsg}]:userMsg;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,system,messages:[{role:'user',content}]})});
  const d=await r.json();const t=d.content?.find(b=>b.type==='text')?.text||'';
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

function setScanMode(m){

function scanPreview(input){
  var file=input.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=1200,w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      var jpeg=cv.toDataURL('image/jpeg',.9);scanImgB64=jpeg.split(',')[1];
      var prev=document.getElementById('scan-img-prev');
      if(prev)prev.innerHTML='<img src="'+jpeg+'" style="width:100%;border-radius:10px;max-height:200px;object-fit:contain;background:#000">';
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

        var MAX=900,w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
        vtPhotos.push({id:gid(),data:cv.toDataURL('image/jpeg',.78)});renderVtPhotos();
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function renderVtPhotos(){
  var grid=document.getElementById('vt-photo-grid');if(!grid)return;
  grid.innerHTML=vtPhotos.map(function(p){
    return '<div style="position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e8eef8"><img src="'+p.data+'" style="width:100%;height:100%;object-fit:cover;cursor:pointer" onclick="openPhViewer(this.src)"><button onclick="removeVtPhoto(''+p.id+'')" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(220,38,38,.85);color:#fff;border:none;cursor:pointer;font-size:11px">✕</button></div>';
  }).join('');
}
function removeVtPhoto(id){vtPhotos=vtPhotos.filter(function(p){return p.id!==id;});renderVtPhotos();}
function openPhViewer(src){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer';
  el.onclick=function(){el.remove();};
  el.innerHTML='<img src="'+src+'" style="max-width:95vw;max-height:85vh;border-radius:10px;object-fit:contain"><button onclick="event.stopPropagation();this.parentElement.remove()" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer">✕</button>';
  document.body.appendChild(el);
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-action],[data-close],[data-open-client],[data-open-devis],[data-open-visite],[data-open-plan],[data-save-client],[data-delete-client],[data-save-devis],[data-delete-devis],[data-save-visite],[data-delete-visite],[data-save-plan],[data-delete-plan],[data-print-devis],[data-print-visite],[data-add-line],[data-remove-line],[data-date],[data-save-settings],[data-wipe],[data-ai-generate],[data-ai-create]');if(!t)return;if(t.dataset.page)go(t.dataset.page);if(t.dataset.close!==undefined)closeModal();if(t.dataset.action==='new-client')openClient();if(t.dataset.action==='new-devis')openDevis();if(t.dataset.action==='new-visite')openVisite();if(t.dataset.action==='new-plan')openPlan();if(t.dataset.action==='settings')openSettings();if(t.dataset.action==='scanner'||t.dataset.action==='ai-fill')scannerModal();if(t.dataset.action==='demo')demo();if(t.dataset.action==='export-json')download('chantierspro-sauvegarde.json',JSON.stringify(DB,null,2),'application/json');if(t.dataset.action==='export-clients')download('clients.csv',csv([['Nom','Société','Téléphone','Email','Ville'],...DB.clients.map(c=>[cname(c),c.societe,c.tel,c.email,c.ville])]),'text/csv');if(t.dataset.action==='export-devis')download('devis.csv',csv([['Numéro','Client','Objet','Date','Statut','HT','TTC'],...DB.devis.map(d=>[d.numero,cname(client(d.clientId)),d.objet,d.date,d.statut,d.totalHT,d.totalTTC])]),'text/csv');if(t.dataset.openClient)openClient(t.dataset.openClient);if(t.dataset.openDevis)openDevis(t.dataset.openDevis);if(t.dataset.openVisite)openVisite(t.dataset.openVisite);if(t.dataset.openPlan)openPlan(t.dataset.openPlan);if(t.dataset.saveClient!==undefined){const id=t.dataset.saveClient,obj={id:id||gid(),prenom:$('#f-prenom').value.trim(),nom:$('#f-nom').value.trim(),societe:$('#f-societe').value.trim(),type:$('#f-type').value,tel:$('#f-tel').value.trim(),email:$('#f-email').value.trim(),adresse:$('#f-adresse').value.trim(),cp:$('#f-cp').value.trim(),ville:$('#f-ville').value.trim(),notes:$('#f-notes').value.trim()};if(!obj.prenom&&!obj.nom&&!obj.societe){toast('Nom ou société obligatoire','err');return}id?DB.clients=DB.clients.map(c=>c.id===id?obj:c):DB.clients.unshift(obj);save();closeModal();toast('Client enregistré','ok')}if(t.dataset.deleteClient&&confirm('Supprimer ce client ?')){DB.clients=DB.clients.filter(c=>c.id!==t.dataset.deleteClient);save();closeModal()}if(t.dataset.saveDevis!==undefined)saveDevis(t.dataset.saveDevis);if(t.dataset.deleteDevis&&confirm('Supprimer ce devis ?')){DB.devis=DB.devis.filter(d=>d.id!==t.dataset.deleteDevis);save();closeModal()}if(t.dataset.saveVisite!==undefined)saveVisite(t.dataset.saveVisite);if(t.dataset.deleteVisite&&confirm('Supprimer cette visite ?')){DB.visites=DB.visites.filter(v=>v.id!==t.dataset.deleteVisite);save();closeModal()}if(t.dataset.savePlan!==undefined)savePlan(t.dataset.savePlan);if(t.dataset.deletePlan&&confirm('Supprimer cet élément ?')){DB.planning=DB.planning.filter(p=>p.id!==t.dataset.deletePlan);save();closeModal()}if(t.dataset.printDevis)printDevis(t.dataset.printDevis);if(t.dataset.printVisite)printVisite(t.dataset.printVisite);if(t.dataset.addLine!==undefined){$('#d-lines').insertAdjacentHTML('beforeend',lineRow());calcDraft()}if(t.dataset.removeLine!==undefined){t.closest('tr').remove();calcDraft()}if(t.dataset.date){selectedDate=t.dataset.date;renderWeek();renderPlan()}if(t.dataset.saveSettings!==undefined){DB.settings={...DB.settings,entreprise:$('#s-entreprise').value.trim(),siret:$('#s-siret').value.trim(),tel:$('#s-tel').value.trim(),email:$('#s-email').value.trim(),adresse:$('#s-adresse').value.trim(),prefix:$('#s-prefix').value.trim()||DB.settings.prefix};save();closeModal();toast('Paramètres sauvegardés','ok')}if(t.dataset.wipe&&confirm('Effacer toutes les données locales ?')){DB=seed();save();closeModal();toast('Données réinitialisées','ok')}if(t.dataset.aiGenerate!==undefined)aiGenerate();if(t.dataset.aiCreate){const lines=JSON.parse(t.dataset.aiCreate);closeModal();openDevis();$('#d-lines').innerHTML=lines.map(lineRow).join('');$('#d-objet').value='Devis généré depuis assistant';$('#d-bio').checked=lines.some(l=>/biosour|AT|règles/.test(l.designation));calcDraft();toast('Lignes appliquées au devis','ok')}});
document.addEventListener('input',e=>{if(e.target.closest('#q-clients'))renderClients();if(e.target.closest('#q-visites'))renderVisites();if(e.target.closest('#d-lines')||['d-mo','d-dep','h-taux','h-heures','h-fournitures','h-marge'].includes(e.target.id))calcDraft()});document.addEventListener('change',e=>{if(['d-tva','d-hourly','h-contrainte'].includes(e.target.id))calcDraft();if(e.target.id==='import-file'&&e.target.files[0])importDB(e.target.files[0])});$('#devis-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;currentFilter=b.dataset.filter;$$('#devis-tabs .tab').forEach(x=>x.classList.toggle('active',x===b));renderDevis()});renderAll();window.ChantiersPro={getDB:()=>DB,reset:()=>{DB=seed();save()},demo};
})();
