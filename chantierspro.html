<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, onSnapshot, enableIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB2rdib1rJRusZVoY25VmzO5WP4IAzjfkU",
  authDomain: "chantierpro-eabab.firebaseapp.com",
  projectId: "chantierpro-eabab",
  storageBucket: "chantierpro-eabab.firebasestorage.app",
  messagingSenderId: "453340640805",
  appId: "1:453340640805:web:aebf71cb00e7bb02de31cc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Persistance hors ligne
enableIndexedDbPersistence(db).catch(()=>{});

window._FB = { auth, db, doc, setDoc, onSnapshot,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail };

let _unsub = null, _uid = null;

window._fbSave = async function(data) {
  if(!_uid) return;
  try {
    await setDoc(doc(db,'users',_uid,'data','main'), {
      payload: JSON.stringify(data), updatedAt: Date.now()
    });
  } catch(e) { console.warn('Sync:', e.message); }
};

window._fbStartSync = function(uid, onData) {
  _uid = uid;
  if(_unsub) _unsub();
  _unsub = onSnapshot(doc(db,'users',uid,'data','main'), function(snap) {
    if(snap.exists()) {
      try { onData(JSON.parse(snap.data().payload)); } catch(e) {}
    }
  }, function(err){ console.warn('Sync err:', err.message); });
};

window._fbStopSync = function() {
  if(_unsub){ _unsub(); _unsub=null; } _uid=null;
};

onAuthStateChanged(auth, function(user) {
  window._currentUser = user;
  if(user && window._onLoginSuccess) window._onLoginSuccess(user);
  if(!user && window._onLogout) window._onLogout();
});
</script>

<section id="devis" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>📋 Devis</b><span></span></header><div class="tabs" id="devis-tabs"><button class="tab active" data-filter="tous">Tous</button><button class="tab" data-filter="brouillon">Brouillon</button><button class="tab" data-filter="envoyé">Envoyés</button><button class="tab" data-filter="signé">Signés</button><button class="tab" data-filter="refusé">Refusés</button></div><div id="list-devis" class="list"></div><button class="fab" data-action="new-devis">+</button></section>
<section id="visites" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>🔍 Visites prospects</b><span></span></header><div class="toolbar"><input id="q-visites" class="search" placeholder="Rechercher une visite…"></div><div id="list-visites" class="list"></div><button class="fab" data-action="new-visite">+</button></section>
<section id="planning" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>📅 Planning</b><span></span></header><div id="week" class="week"></div><div style="padding:8px 16px;display:flex;justify-content:space-between;align-items:center"><b id="plan-label">Aujourd'hui</b><button class="badge" data-action="new-plan">+ Ajouter</button></div><div id="list-plan" class="list"></div></section>
<section id="exports" class="page"><header class="top"><button class="back" data-page="home">← Accueil</button><b>📤 Export</b><span></span></header><div class="list"><div class="card"><div class="title">Documents</div><div class="sub">Sélectionne un devis ou une visite depuis sa fiche pour imprimer/exporter.</div></div><button class="row" data-action="export-json"><div class="ic" style="background:#eaf2ff">💾</div><div class="grow"><div class="title">Sauvegarde complète JSON</div><div class="sub">Clients, devis, visites, planning, paramètres</div></div>↓</button><button class="row" data-action="export-clients"><div class="ic" style="background:#dcfce7">👥</div><div class="grow"><div class="title">Export clients CSV</div><div class="sub">Compatible Excel / Numbers</div></div>↓</button><button class="row" data-action="export-devis"><div class="ic" style="background:#fef3c7">📋</div><div class="grow"><div class="title">Export devis CSV</div><div class="sub">Suivi CA et statuts</div></div>↓</button><label class="row"><div class="ic" style="background:#fee2e2">📂</div><div class="grow"><div class="title">Importer une sauvegarde</div><div class="sub">Fichier JSON ChantiersPro Max</div></div><input id="import-file" type="file" accept=".json,application/json" hidden></label><button class="row" data-action="demo"><div class="ic" style="background:#e9d5ff">🧪</div><div class="grow"><div class="title">Charger des données de démonstration</div><div class="sub">Utile pour tester l'application rapidement</div></div>+</button></div></section>
<div id="modal-root"></div>
<script>
(()=>{'use strict';
const KEY='chantierspro_max_v1';let DB=load(),currentFilter='tous',selectedDate=today();
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function today(){return new Date().toISOString().slice(0,10)}function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function seed(){return{clients:[],devis:[],visites:[],planning:[],settings:{
  entreprise:'',siret:'',tel:'',email:'',adresse:'',prefix:'DEV-'+new Date().getFullYear()+'-',nextNum:1,logo:'',
  tarifs:{
    carreleur_mo:42, peintre_mo:38, plombier_mo:62, electricien_mo:60, menuisier_mo:50, macon_mo:45, polyvalent_mo:45,
    marge:0, tva_defaut:10,
    notes:''
  },
  ai:{provider:'claude',claudeKey:'',openaiKey:'',claudeModel:'claude-sonnet-4-20250514',openaiModel:'gpt-4.1-mini',proxyUrl:''}
}}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));renderAll()}function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function money(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function fmt(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR')}function cname(c){return [c?.prenom,c?.nom].filter(Boolean).join(' ')||c?.societe||'Client sans nom'}function client(id){return DB.clients.find(c=>c.id===id)}
function toast(m,t=''){const el=$('#toast');if(!el)return;el.textContent=m;el.className='toast show '+t;setTimeout(()=>el.className='toast',2300)}
function go(id){$$('.page').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');scrollTo(0,0);renderAll()}
function renderAll(){renderHome();renderClients();renderDevis();renderVisites();renderWeek();renderPlan()}
function renderHome(){if(!$('#st-clients'))return;const ca=DB.devis.filter(d=>d.statut==='signé').reduce((s,d)=>s+(d.totalTTC||0),0);$('#st-clients').textContent=DB.clients.length;$('#st-devis').textContent=DB.devis.length;$('#st-ca').textContent=ca>999?Math.round(ca/100)/10+' k€':Math.round(ca)+' €';$('#b-clients').textContent=DB.clients.length;$('#b-devis').textContent=DB.devis.length;$('#b-visites').textContent=DB.visites.length;$('#b-plan').textContent=DB.planning.filter(p=>p.dateFin>=today()).length;const box=$('#home-devis');if(!DB.devis.length){box.innerHTML='<div class="empty"><div>📋</div>Aucun devis pour le moment</div>';return}box.innerHTML=DB.devis.slice(0,3).map(devisCard).join('')}
function renderClients(){if(!$('#list-clients'))return;const q=($('#q-clients')?.value||'').toLowerCase();const items=DB.clients.filter(c=>(cname(c)+' '+c.ville+' '+c.societe).toLowerCase().includes(q));$('#list-clients').innerHTML=items.length?items.map(c=>`<article class="card" data-open-client="${c.id}"><div class="between"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${esc(cname(c)[0]||'?')}</div><div><div class="title">${esc(cname(c))}</div><div class="sub">${esc(c.societe||c.type||'Particulier')}</div></div></div><span class="badge">${DB.devis.filter(d=>d.clientId===c.id).length} devis</span></div><div class="meta">${c.tel?`<span>📞 ${esc(c.tel)}</span>`:''}${c.email?`<span>✉️ ${esc(c.email)}</span>`:''}${c.ville?`<span>📍 ${esc(c.ville)}</span>`:''}</div></article>`).join(''):'<div class="empty"><div>👥</div>Aucun client trouvé</div>'}
function devisCard(d){const c=client(d.clientId);const cls={brouillon:'',envoyé:'',signé:' style="background:#dcfce7;color:#15803d"',refusé:' style="background:#fee2e2;color:#dc2626"'}[d.statut]||'';return`<article class="card" data-open-devis="${d.id}"><div class="between"><div><div class="title">${esc(d.numero)} ${d.isBio?'🌿':''} ${d.hourly?.enabled?'⏱️':''}</div><div class="sub">${esc(c?cname(c):'Sans client')} · ${esc(d.objet||'Sans objet')}</div></div><div style="text-align:right"><div class="amt">${money(d.totalTTC)}</div><span class="badge"${cls}>${esc(d.statut)}</span></div></div><div class="meta"><span>📅 ${fmt(d.date)}</span><span>TVA ${d.tva||0}%</span></div></article>`}
function renderDevis(){if(!$('#list-devis'))return;const list=currentFilter==='tous'?DB.devis:DB.devis.filter(d=>d.statut===currentFilter);$('#list-devis').innerHTML=list.length?list.map(devisCard).join(''):'<div class="empty"><div>📋</div>Aucun devis dans cette catégorie</div>'}
function renderVisites(){if(!$('#list-visites'))return;const q=($('#q-visites')?.value||'').toLowerCase();const arr=DB.visites.filter(v=>{const c=client(v.clientId);return (cname(c)+' '+v.nature+' '+v.adresse+' '+v.travaux).toLowerCase().includes(q)});$('#list-visites').innerHTML=arr.length?arr.map(v=>{const c=client(v.clientId);return`<article class="card" data-open-visite="${v.id}"><div class="between"><div><div class="title">${esc(c?cname(c):'Prospect')}</div><div class="sub">${esc(v.nature||'Visite')} · ${fmt(v.date)}</div></div><span class="badge">${esc(v.proba||'moyenne')}</span></div><div class="meta"><span>📍 ${esc(v.adresse||'Adresse non renseignée')}</span>${v.budget?`<span>💶 ${money(v.budget)}</span>`:''}</div></article>`}).join(''):'<div class="empty"><div>🔍</div>Aucune visite</div>'}
function renderWeek(){if(!$('#week'))return;const base=new Date(selectedDate+'T12:00:00'),start=new Date(base);start.setDate(base.getDate()-((base.getDay()+6)%7));$('#week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);return`<button class="day ${iso===selectedDate?'active':''}" data-date="${iso}"><span>${d.toLocaleDateString('fr-FR',{weekday:'short'}).slice(0,3)}</span><b>${d.getDate()}</b></button>`}).join('');$('#plan-label').textContent=selectedDate===today()?"Aujourd'hui":fmt(selectedDate)}
function renderPlan(){if(!$('#list-plan'))return;const arr=DB.planning.filter(p=>selectedDate>=p.dateDebut&&selectedDate<=p.dateFin);$('#list-plan').innerHTML=arr.length?arr.map(p=>`<article class="card" data-open-plan="${p.id}"><div class="between"><div><div class="title">${esc(p.titre)}</div><div class="sub">${esc(p.type||'Intervention')} · ${esc(p.heureDebut||'08:00')}–${esc(p.heureFin||'17:00')}</div></div><span class="badge">${esc(client(p.clientId)?cname(client(p.clientId)):'—')}</span></div><div class="meta"><span>📍 ${esc(p.adresse||'Adresse non renseignée')}</span>${p.intervenants?`<span>👷 ${esc(p.intervenants)}</span>`:''}</div></article>`).join(''):'<div class="empty"><div>📅</div>Rien de prévu ce jour</div>'}
function modal(title,body){const mr=$('#modal-root');if(!mr)return;mr.innerHTML=`<div class="modal-bg active"><div class="modal"><div class="handle"></div><div class="mh"><b>${title}</b><button class="close" data-close>✕</button></div><div class="mb">${body}</div></div></div>`}
function closeModal(){ const mr=$('#modal-root'); if(mr) mr.innerHTML=''; }
function clientOptions(sel=''){return '<option value="">— Sélectionner —</option>'+DB.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(cname(c))}</option>`).join('')}
function openClient(id){const c=id?client(id):{};modal(id?'Modifier client':'Nouveau client',`<span class="sh">Identité</span><div class="grid2"><div class="fg"><label class="lbl">Prénom</label><input class="inp" id="f-prenom" value="${esc(c.prenom||'')}"></div><div class="fg"><label class="lbl">Nom</label><input class="inp" id="f-nom" value="${esc(c.nom||'')}"></div></div><div class="fg"><label class="lbl">Société</label><input class="inp" id="f-societe" value="${esc(c.societe||'')}"></div><div class="fg"><label class="lbl">Type</label><select class="sel" id="f-type">${['particulier','professionnel','syndic','promoteur'].map(x=>`<option ${c.type===x?'selected':''}>${x}</option>`).join('')}</select></div><span class="sh">Coordonnées</span><div class="fg"><label class="lbl">Téléphone</label><input class="inp" id="f-tel" value="${esc(c.tel||'')}"></div><div class="fg"><label class="lbl">Email</label><input class="inp" id="f-email" value="${esc(c.email||'')}"></div><div class="fg"><label class="lbl">Adresse</label><input class="inp" id="f-adresse" value="${esc(c.adresse||'')}"></div><div class="grid2"><div class="fg"><label class="lbl">Code postal</label><input class="inp" id="f-cp" value="${esc(c.cp||'')}"></div><div class="fg"><label class="lbl">Ville</label><input class="inp" id="f-ville" value="${esc(c.ville||'')}"></div></div><div class="fg"><label class="lbl">Notes</label><textarea class="ta" id="f-notes">${esc(c.notes||'')}</textarea></div><div class="btns">${id?'<button class="btn danger" data-delete-client="'+id+'">Supprimer</button>':''}<button class="btn secondary" data-close>Annuler</button><button class="btn primary" data-save-client="${id||''}">Enregistrer</button></div>`)}
function openDevis(id){const d=id?DB.devis.find(x=>x.id===id):{numero:DB.settings.prefix+String(DB.settings.nextNum).padStart(4,'0'),date:today(),valid:30,statut:'brouillon',tva:10,lignes:[{designation:'',unite:'u',qte:1,pu:0}],mo:0,dep:0,hourly:{enabled:false,taux:45,heures:0,contrainte:25,fournitures:0,marge:0}};const h=d.hourly||{};modal(id?'Modifier devis':'Nouveau devis',`<button class="row dark" style="width:100%;margin-bottom:12px" data-action="ai-fill"><div class="ic">✨</div><div class="grow"><div class="title">Assistant IA local</div><div class="sub">Générer des lignes depuis une description</div></div></button><span class="sh">Informations</span><div class="fg"><label class="lbl">Numéro</label><input class="inp" id="d-numero" value="${esc(d.numero)}"></div><div class="fg"><label class="lbl">Client</label><select class="sel" id="d-client">${clientOptions(d.clientId)}</select></div><div class="fg"><label class="lbl">Objet</label><input class="inp" id="d-objet" value="${esc(d.objet||'')}"></div><div class="grid2"><div class="fg"><label class="lbl">Date</label><input class="inp" id="d-date" type="date" value="${esc(d.date)}"></div><div class="fg"><label class="lbl">Validité</label><input class="inp" id="d-valid" type="number" value="${esc(d.valid||30)}"></div></div><div class="fg"><label class="lbl">Statut</label><select class="sel" id="d-statut">${['brouillon','envoyé','signé','refusé'].map(s=>`<option ${d.statut===s?'selected':''}>${s}</option>`).join('')}</select></div><label class="row" style="margin-bottom:12px"><input type="checkbox" id="d-bio" ${d.isBio?'checked':''}><div><div class="title">🌿 Devis biosourcé</div><div class="sub">Ajoute une mention matériaux écologiques / AT / règles pro</div></div></label><label class="row" style="margin-bottom:12px;background:#fff8ed;border-color:#fed7aa"><input type="checkbox" id="d-hourly" ${h.enabled?'checked':''}><div><div class="title">⏱️ Chantier contraint / au temps passé</div><div class="sub">Pour petits chantiers, accès difficile, attente, manutention ou imprévus</div></div></label><div id="hourly-panel" style="display:${h.enabled?'block':'none'};background:#fff7ed;border:1.5px solid #fed7aa;border-radius:14px;padding:13px;margin-bottom:12px"><div class="sub" style="color:#9a3412;margin-bottom:10px"><b>Mode horaire :</b> le devis intègre le temps perdu lié aux contraintes du chantier.</div><div class="grid2"><div class="fg"><label class="lbl">Taux horaire HT</label><input class="inp" id="h-taux" type="number" value="${h.taux??45}"></div><div class="fg"><label class="lbl">Heures estimées</label><input class="inp" id="h-heures" type="number" step="0.5" value="${h.heures??0}"></div></div><div class="grid2"><div class="fg"><label class="lbl">Contrainte / temps perdu</label><select class="sel" id="h-contrainte">${[[0,'Normal +0%'],[15,'Contraintes légères +15%'],[25,'Contraintes fortes +25%'],[40,'Très contraignant +40%']].map(a=>`<option value="${a[0]}" ${Number(h.contrainte??25)===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="fg"><label class="lbl">Petites fournitures HT</label><input class="inp" id="h-fournitures" type="number" value="${h.fournitures??0}"></div></div><div class="fg"><label class="lbl">Marge sécurité (%)</label><input class="inp" id="h-marge" type="number" value="${h.marge??0}"></div></div><span class="sh">Lignes classiques</span><div class="table-wrap"><table class="tbl"><thead><tr><th>Désignation</th><th>Unité</th><th>Qté</th><th>P.U. HT</th><th></th></tr></thead><tbody id="d-lines">${(d.lignes||[]).map(lineRow).join('')}</tbody></table></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn secondary" data-add-line>+ Ligne</button><button class="btn" onclick="openMetreur()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:900;border:none;border-radius:12px;padding:12px;cursor:pointer;font-family:inherit;font-size:14px">&#x1F4D0; Metres</button></div><div class="grid2" style="margin-top:12px"><div class="fg"><label class="lbl">Main d'œuvre HT classique</label><input class="inp" id="d-mo" type="number" value="${d.mo||0}"></div><div class="fg"><label class="lbl">Déplacement HT</label><input class="inp" id="d-dep" type="number" value="${d.dep||0}"></div></div><div class="fg"><label class="lbl">TVA</label><select class="sel" id="d-tva">${[0,5.5,10,20].map(t=>`<option value="${t}" ${Number(d.tva)===t?'selected':''}>${String(t).replace('.',',')}%</option>`).join('')}</select></div><div class="sum" id="d-sum"></div><div class="fg"><label class="lbl">Remarques</label><textarea class="ta" id="d-rem">${esc(d.rem||'')}</textarea></div><div class="btns">${id?'<button class="btn danger" data-delete-devis="'+id+'">Supprimer</button><button class="btn ok" data-print-devis="'+id+'">PDF</button>':''}<button class="btn secondary" data-close>Annuler</button><button class="btn primary" data-save-devis="${id||''}">Enregistrer</button></div>`);calcDraft()}
function lineRow(l={designation:'',unite:'u',qte:1,pu:0}){return`<tr><td><input class="ti dl-designation" value="${esc(l.designation)}" placeholder="Ouvrage"></td><td><input class="ti dl-unite" value="${esc(l.unite||'u')}"></td><td><input class="ti dl-qte" type="number" value="${Number(l.qte)||0}"></td><td><input class="ti dl-pu" type="number" value="${Number(l.pu)||0}"></td><td><button class="badge" data-remove-line>×</button></td></tr>`}
function getDraftLines(){return $$('#d-lines tr').map(tr=>({designation:tr.querySelector('.dl-designation').value.trim(),unite:tr.querySelector('.dl-unite').value.trim()||'u',qte:Number(tr.querySelector('.dl-qte').value)||0,pu:Number(tr.querySelector('.dl-pu').value)||0})).filter(l=>l.designation||l.qte||l.pu)}
function hourlyValues(){const enabled=!!$('#d-hourly')?.checked;return{enabled,taux:Number($('#h-taux')?.value)||0,heures:Number($('#h-heures')?.value)||0,contrainte:Number($('#h-contrainte')?.value)||0,fournitures:Number($('#h-fournitures')?.value)||0,marge:Number($('#h-marge')?.value)||0}}
function hourlyCalc(h,dep=0){const base=h.heures*h.taux,perdu=base*h.contrainte/100,sous=base+perdu+dep+h.fournitures,marge=sous*h.marge/100;return{base,perdu,marge,total:sous+marge}}
function updateHourlyPanel(){const p=$('#hourly-panel'),cb=$('#d-hourly'),mo=$('#d-mo');if(p&&cb)p.style.display=cb.checked?'block':'none';if(mo&&cb)mo.disabled=cb.checked}
function calcDraft(){if(!$('#d-sum'))return;updateHourlyPanel();const lignesTotal=getDraftLines().reduce((s,l)=>s+l.qte*l.pu,0),dep=Number($('#d-dep').value)||0,h=hourlyValues();let details='',ht=0;if(h.enabled){const hc=hourlyCalc(h,dep);ht=lignesTotal+hc.total;details=`<p><span>Lignes classiques</span><b>${money(lignesTotal)}</b></p><p><span>Main-d'œuvre horaire</span><b>${money(hc.base)}</b></p><p><span>Temps perdu / contraintes ${h.contrainte}%</span><b>${money(hc.perdu)}</b></p><p><span>Déplacement</span><b>${money(dep)}</b></p><p><span>Petites fournitures</span><b>${money(h.fournitures)}</b></p>${h.marge?`<p><span>Marge sécurité ${h.marge}%</span><b>${money(hc.marge)}</b></p>`:''}`}else{ht=lignesTotal+(Number($('#d-mo').value)||0)+dep;details=`<p><span>Lignes</span><b>${money(lignesTotal)}</b></p><p><span>Main-d'œuvre</span><b>${money(Number($('#d-mo').value)||0)}</b></p><p><span>Déplacement</span><b>${money(dep)}</b></p>`}const tva=Number($('#d-tva').value)||0,ttc=ht*(1+tva/100);$('#d-sum').innerHTML=`${details}<p><span>Total HT</span><b>${money(ht)}</b></p><p><span>TVA</span><b>${money(ttc-ht)}</b></p><p class="total"><span>Total TTC</span><b>${money(ttc)}</b></p>`}
function saveDevis(id){const lignes=getDraftLines(),h=hourlyValues();if(!$('#d-objet').value.trim()){toast('Objet du devis obligatoire','err');return}if(!h.enabled&&!lignes.length){toast('Ajoute au moins une ligne de devis','err');return}if(h.enabled&&(!h.heures||!h.taux)){toast('Renseigne les heures et le taux horaire','err');return}const lignesTotal=lignes.reduce((s,l)=>s+l.qte*l.pu,0),dep=Number($('#d-dep').value)||0,hc=hourlyCalc(h,dep);const ht=h.enabled?lignesTotal+hc.total:lignesTotal+(Number($('#d-mo').value)||0)+dep,tva=Number($('#d-tva').value)||0,obj={id:id||gid(),numero:$('#d-numero').value.trim(),clientId:$('#d-client').value,objet:$('#d-objet').value.trim(),date:$('#d-date').value,valid:Number($('#d-valid').value)||30,statut:$('#d-statut').value,tva,lignes,mo:h.enabled?0:(Number($('#d-mo').value)||0),dep,totalHT:ht,totalTTC:ht*(1+tva/100),rem:$('#d-rem').value.trim(),isBio:$('#d-bio').checked,hourly:h};if(h.enabled&&!obj.rem)obj.rem='Intervention estimée au temps passé en raison des contraintes du chantier. Le montant pourra être ajusté selon le temps réellement nécessaire après accord du client.';if(id){DB.devis=DB.devis.map(d=>d.id===id?obj:d)}else{DB.devis.unshift(obj);DB.settings.nextNum++}save();closeModal();toast('Devis enregistré','ok')}

      let w=img.width, h=img.height, MAX=1200;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}

async function callAIProxy(provider, system, userMsg, imageB64) {
  const ai = DB.settings.ai || {};
  if(!ai.proxyUrl) return null;
  const r = await fetch(ai.proxyUrl, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({provider,system,userMsg,imageB64,model:provider==='chatgpt'?(ai.openaiModel||'gpt-4.1-mini'):(ai.claudeModel||'claude-sonnet-4-20250514')})
  });
  if(!r.ok) throw new Error('Proxy IA indisponible');
  const d = await r.json();
  return d.lignes ? d : cleanAIJSON(d.text || d.output || JSON.stringify(d));
}
async function claudeAPI(system, userMsg, imageB64) {
  const proxied = await callAIProxy('claude', system, userMsg, imageB64);
  if(proxied) return proxied;
  const ai = DB.settings.ai || {};
  if(!ai.claudeKey) throw new Error('Clé API Claude manquante');
  const content = imageB64 ? [{type:'image',source:{type:'base64',media_type:'image/jpeg',data:imageB64}},{type:'text',text:userMsg}] : userMsg;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':ai.claudeKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:ai.claudeModel||'claude-sonnet-4-20250514',max_tokens:2000,system,messages:[{role:'user',content}]})
  });
  if(!r.ok) throw new Error('Erreur API Claude');
  const d = await r.json();
  const t = d.content?.find(b=>b.type==='text')?.text || '';
  return cleanAIJSON(t);
}
async function openaiAPI(system, userMsg, imageB64) {
  const proxied = await callAIProxy('chatgpt', system, userMsg, imageB64);
  if(proxied) return proxied;
  const ai = DB.settings.ai || {};
  if(!ai.openaiKey) throw new Error('Clé API OpenAI manquante');
  const userContent = imageB64
    ? [{type:'input_text',text:userMsg},{type:'input_image',image_url:'data:image/jpeg;base64,'+imageB64}]
    : userMsg;
  const r = await fetch('https://api.openai.com/v1/responses', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.openaiKey},
    body:JSON.stringify({model:ai.openaiModel||'gpt-4.1-mini',max_output_tokens:2000,input:[{role:'system',content:system},{role:'user',content:userContent}]})
  });
  if(!r.ok) throw new Error('Erreur API OpenAI');
  const d = await r.json();
  const t = d.output_text || (d.output||[]).flatMap(o=>o.content||[]).map(c=>c.text||'').join('\n');
  return cleanAIJSON(t);
}

function previewLogo(input) {
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX=200; let w=img.width, h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const data = cv.toDataURL('image/png');
      const prev = document.getElementById('logo-preview');
      if(prev) prev.innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
      // Store temporarily
      window._pendingLogo = data;
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}

// -- Téléchargement avec choix du nom et emplacement (share sheet iOS) --
function downloadFile(filename, content, type) {
  const blob = new Blob([content], {type});
  // Sur iOS Safari, utiliser le partage natif si disponible
  if(navigator.share && navigator.canShare) {
    const file = new File([blob], filename, {type});
    if(navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:filename})
        .catch(() => _fallbackDownload(blob, filename));
      return;
    }
  }
  _fallbackDownload(blob, filename);
}

function _fallbackDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── Voix ──
function toggleVoice(){ _isListening ? stopVoice() : startVoice(); }
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Dictée non supportée','err'); return; }
  _recognition=new SR(); _recognition.lang='fr-FR'; _recognition.continuous=true; _recognition.interimResults=true;
  var btn=document.getElementById('voice-btn'), icon=document.getElementById('voice-icon'),
      lbl=document.getElementById('voice-label'), status=document.getElementById('voice-status'),
      ta=document.getElementById('ai-text');
  _isListening=true;
  if(btn){btn.style.background='rgba(239,68,68,.3)';btn.style.borderColor='#ef4444';}
  if(icon) icon.textContent='⏹️';
  if(lbl) lbl.textContent='Arrêter la dictée';
  if(status) status.style.display='block';
  var final=ta?ta.value:'';
  _recognition.onresult=function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript+' ';
      else interim+=e.results[i][0].transcript;
    }
    if(ta) ta.value=final+interim;
  };
  _recognition.onerror=function(e){ if(e.error!=='no-speech') toast('Erreur micro','err'); stopVoice(); };
  _recognition.onend=function(){ if(_isListening) _recognition.start(); };
  _recognition.start();
}
function stopVoice(){
  _isListening=false;
  if(_recognition){ _recognition.onend=null; _recognition.stop(); _recognition=null; }
  var btn=document.getElementById('voice-btn'), icon=document.getElementById('voice-icon'),
      lbl=document.getElementById('voice-label'), status=document.getElementById('voice-status');
  if(btn){btn.style.background='rgba(255,255,255,.1)';btn.style.borderColor='rgba(255,255,255,.25)';}
  if(icon) icon.textContent='🎤';
  if(lbl) lbl.textContent='Dicter à voix haute';
  if(status) status.style.display='none';
  var ta=document.getElementById('ai-text'); if(ta) ta.value=ta.value.trim();
  toast('Dictée terminée','ok');
}

function cleanJSON(txt){
  var raw=String(txt||'').replace(/```json|```/g,'').trim();
  try{ return JSON.parse(raw); }catch(e){ var m=raw.match(/\{[\s\S]*\}/); if(m) return JSON.parse(m[0]); throw e; }
}
async function claudeAPI(system,userMsg,imageB64){
  var ai=DB.settings.ai||{};
  if(!ai.claudeKey&&!ai.proxyUrl) throw new Error('Clé API Claude manquante — configurez dans ⚙️ Paramètres');
  var content=imageB64?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:imageB64}},{type:'text',text:userMsg}]:userMsg;
  var url=ai.proxyUrl||'https://api.anthropic.com/v1/messages';
  var headers={'Content-Type':'application/json','x-api-key':ai.claudeKey||'','anthropic-version':'2023-06-01'};
  var r=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify({model:ai.claudeModel||'claude-sonnet-4-20250514',max_tokens:2000,system:system,messages:[{role:'user',content:content}]})});
  if(!r.ok){ var err=await r.json().catch(function(){return {};}); throw new Error('Claude: '+(err.error&&err.error.message||r.status)); }
  var d=await r.json();
  return cleanJSON(d.content&&d.content.find(function(b){return b.type==='text';})&&d.content.find(function(b){return b.type==='text';}).text||'');

async function openaiAPI(system,userMsg,imageB64){
  var ai=DB.settings.ai||{};
  if(!ai.openaiKey&&!ai.proxyUrl) throw new Error('Clé API OpenAI manquante — configurez dans ⚙️ Paramètres');
  var userContent=imageB64?[{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+imageB64}},{type:'text',text:userMsg}]:userMsg;
  var url=ai.proxyUrl||'https://api.openai.com/v1/chat/completions';
  var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(ai.openaiKey||'')},body:JSON.stringify({model:ai.openaiModel||'gpt-4o-mini',max_tokens:2000,messages:[{role:'system',content:system},{role:'user',content:userContent}]})});
  if(!r.ok){ var err=await r.json().catch(function(){return {};}); throw new Error('OpenAI: '+(err.error&&err.error.message||r.status)); }
  var d=await r.json();

}
function localAI(desc,bio){
  var txt=(desc||'').toLowerCase(), lines=[], q=20;
  var m=txt.match(/(\d+[,.]?\d*)\s?m[²2]/); if(m) q=Number(m[1].replace(',','.'))||20;
  function add(d,u,q,p){ lines.push({designation:d,unite:u,qte:q,pu:p}); }
  var objet='Travaux';
  if(txt.indexOf('isolation')>=0){
    objet='Isolation';
    add(bio?'Isolant biosourcé ouate cellulose (ATec)':'Isolant fourniture','m2',q,bio?45:30);
    add('Pose isolant','m2',q,20); add('Protection chantier','forfait',1,180);
  } else if(txt.indexOf('carrelage')>=0){
    objet='Carrelage';
    add('Dépose ancien revêtement','m2',q,18);
    add('Fourniture carrelage','m2',Math.round(q*1.1),35);
    add('Pose carrelage','m2',q,38); add('Joints et finitions','forfait',1,150);
  } else if(txt.indexOf('peinture')>=0){
    objet='Peinture';
    add('Protection plastique','forfait',1,120);
    add('Préparation supports','m2',q,12);
    add('Peinture 2 couches','m2',Math.round(q*1.15),22);
  } else if(txt.indexOf('plomberie')>=0||txt.indexOf('sdb')>=0||txt.indexOf('salle de bain')>=0){
    objet='Salle de bain';
    add('WC suspendu fourniture','u',1,450); add('Pose WC suspendu','u',1,180);
    add('Lavabo fourniture','u',1,220); add('Pose lavabo robinetterie','u',1,150);
    add('Carrelage sol fourniture','m2',Math.round(q*1.1),40); add('Pose carrelage sol','m2',q,35);

function scanPreviewImg(input){

      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;

function calcMur(mur){
  var b=(mur.l||0)*(mur.h||0);
  var o=(mur.ouv||[]).reduce(function(s,x){return s+(x.l||0)*(x.h||0);},0);
  return Math.max(0,b-o);
}
function calcPiece(p){ return p.murs.reduce(function(s,m){return s+calcMur(m);},0); }

function buildToit(){
  var d=_toitData;
  var typeLabels=[['1pan','1 pan'],['2pentes','2 pentes'],['4pentes','4 pentes'],['mansarde','Mansarde']];
  var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">';
  for(var ti=0;ti<typeLabels.length;ti++){
    var tid=typeLabels[ti][0], tlbl=typeLabels[ti][1], ta=d.type===tid;
    h+='<button data-toit-type="'+tid+'" style="padding:9px;border-radius:10px;border:1.5px solid '+(ta?'#7c3aed':'#dce6f4')+';background:'+(ta?'#7c3aed':'#fff')+';color:'+(ta?'#fff':'#607590')+';font-family:inherit;font-size:12px;font-weight:900;cursor:pointer">'+tlbl+'</button>';
  }
  h+='</div><div style="background:#f8faff;border:1.5px solid #dce6f4;border-radius:14px;padding:13px;margin-bottom:12px">';
  function fld(lbl,k,val){
    return '<div><label style="font-size:10px;color:#607590;font-weight:900;text-transform:uppercase;display:block;margin-bottom:3px">'+lbl+'</label>'
      +'<input type="number" step="0.01" value="'+(val||'')+'" data-toit-k="'+k+'" style="width:100%;border:1.5px solid #dce6f4;border-radius:8px;padding:8px;font-family:inherit;font-size:14px;outline:none"></div>';
  }
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+fld('Long. faîtage (m)','l',d.l)+fld('Larg. bâtiment (m)','w',d.w)+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+fld('Débord (m)','debord',d.debord)+fld('Pente pan 1 (°)','pente',d.pente)+'</div>';
  if(d.type!=='1pan') h+='<div style="margin-bottom:8px">'+fld('Pente pan 2 (°)','pente2',d.pente2)+'</div>';
  if(d.type==='4pentes') h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+fld('Pente pan 3 (°)','pente3',d.pente3)+fld('Pente pan 4 (°)','pente4',d.pente4)+'</div>';
  var surf=0, detail='';
  if(d.l&&d.w){
    var deb=d.debord||0;
    function pan(l,w,pente,deb){ var rad=pente*Math.PI/180; return l*(w/2/Math.cos(rad)+deb); }
    if(d.type==='1pan'){ surf=pan(d.l,d.w*2,d.pente,deb); detail='Pan unique'; }
    else if(d.type==='2pentes'){ var s1=pan(d.l,d.w,d.pente,deb),s2=pan(d.l,d.w,d.pente2||d.pente,deb); surf=s1+s2; detail='Pan1: '+s1.toFixed(2)+' Pan2: '+s2.toFixed(2); }
    else if(d.type==='4pentes'){
      var s1=pan(d.l,d.w,d.pente,deb),s2=pan(d.l,d.w,d.pente2||d.pente,deb);
      var lT=(d.w/2)/Math.cos((d.pente3||d.pente)*Math.PI/180)+deb, s3=0.5*(d.w+2*deb)*lT;
      var lT2=(d.w/2)/Math.cos((d.pente4||d.pente)*Math.PI/180)+deb, s4=0.5*(d.w+2*deb)*lT2;
      surf=s1+s2+s3+s4; detail='Longs: '+(s1+s2).toFixed(2)+' Pignons: '+(s3+s4).toFixed(2);
    } else {
      var s1=pan(d.l,d.w,d.pente,deb),s2=s1,s3=pan(d.l,d.w*.5,d.pente2||15,0),s4=s3;
      surf=s1+s2+s3+s4; detail='Bas: '+(s1+s2).toFixed(2)+' Hauts: '+(s3+s4).toFixed(2);
    }
  }
  if(surf>0){
    h+='<div style="background:linear-gradient(135deg,#4338ca,#7c3aed);border-radius:10px;padding:11px 13px;margin-top:8px">';
    h+='<div style="color:rgba(255,255,255,.75);font-size:12px;margin-bottom:4px">'+detail+'</div>';
    h+='<div style="display:flex;align-items:center;justify-content:space-between">';
    h+='<span style="color:#fff;font-size:20px;font-weight:900">'+surf.toFixed(2)+' m²</span>';
    h+='<button data-inject-val="'+surf.toFixed(2)+'" data-inject-unit="m2" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:900">→ Devis</button></div></div>';
  }
  h+='</div><div class="btns"><button class="btn secondary" data-close>Fermer</button></div>';
  return h;
}

function injectVal(val,unit,lbl){
  var rows=document.querySelectorAll('#d-lines tr'); var done=false;
  rows.forEach(function(row){
    if(done)return;
    var q=row.querySelector('.dl-qte'),des=row.querySelector('.dl-designation'),un=row.querySelector('.dl-unite');
    if(q&&(!q.value||q.value==='0'||q.value==='1')){
      q.value=parseFloat(val).toFixed(2);
      if(des&&!des.value&&lbl) des.value=lbl;
      if(un) un.value=unit;
      done=true;
    }
  });
  if(!done){
    var tbody=document.getElementById('d-lines');
    if(tbody) tbody.innerHTML+=lineRow({designation:lbl||'Métré',unite:unit,qte:parseFloat(val),pu:0});
  }
  calcDraft();
  toast('Injecté: '+parseFloat(val).toFixed(2)+' '+unit,'ok');
}

function generateSVGPlan(piece, pi) {
  if(!piece.sol.l || !piece.sol.w) return '';

  var W = 500, MARGIN = 55, CART_H = 52;
  var roomL = piece.sol.l, roomW = piece.sol.w;
  var avail = W - 2*MARGIN;
  var scale = Math.min(avail/roomL, avail/roomW, 90);
  var drawL = roomL*scale, drawW = roomW*scale;
  var H = drawW + 2*MARGIN + CART_H + 30;
  var ox = MARGIN, oy = MARGIN;
  var WALL = 14;

  var client = _metrClientId ? DB.clients.find(function(c){return c.id===_metrClientId;}) : null;
  var ent = DB.settings.entreprise || 'ChantiersPro';
  var dateStr = new Date().toLocaleDateString('fr-FR');
  var clientStr = client ? ([client.prenom,client.nom].filter(Boolean).join(' ')||client.societe||'Client') : 'Estimation libre';

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;border-radius:8px">';

  // Motif hachures murs
  svg += '<defs>';
  svg += '<pattern id="hatch_'+pi+'" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">';
  svg += '<line x1="0" y1="0" x2="0" y2="6" stroke="#8c8070" stroke-width="1.2"/>';
  svg += '</pattern>';
  svg += '</defs>';

  // Fond papier crème
  svg += '<rect width="'+W+'" height="'+H+'" fill="#f5f0e8"/>';
  svg += '<rect x="6" y="6" width="'+(W-12)+'" height="'+(H-12)+'" fill="none" stroke="#c8bfaa" stroke-width="0.5"/>';

  // Titre
  svg += '<text x="'+(W/2)+'" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#2d2820" letter-spacing="1.5">'+escSVG(piece.nom.toUpperCase())+' — VUE EN PLAN</text>';

  // Sol intérieur crème
  svg += '<rect x="'+ox+'" y="'+oy+'" width="'+drawL+'" height="'+drawW+'" fill="#ede8dc"/>';

  // Carrelage sol
  svg += '<g stroke="#d4cdb8" stroke-width="0.4" opacity="0.7">';
  var step = Math.max(20, scale*0.3);
  for(var x=ox+step; x<ox+drawL; x+=step) svg += '<line x1="'+x+'" y1="'+oy+'" x2="'+x+'" y2="'+(oy+drawW)+'"/>';
  for(var y=oy+step; y<oy+drawW; y+=step) svg += '<line x1="'+ox+'" y1="'+y+'" x2="'+(ox+drawL)+'" y2="'+y+'"/>';
  svg += '</g>';

  // MURS avec hachures
  var walls = [
    {x:ox-WALL, y:oy-WALL, w:drawL+2*WALL, h:WALL}, // haut
    {x:ox-WALL, y:oy+drawW, w:drawL+2*WALL, h:WALL}, // bas (avec ouverture porte)
    {x:ox-WALL, y:oy-WALL, w:WALL, h:drawW+2*WALL},  // gauche
    {x:ox+drawL, y:oy-WALL, w:WALL, h:drawW+2*WALL}  // droit
  ];

  // Mur haut
  svg += '<rect x="'+(ox-WALL)+'" y="'+(oy-WALL)+'" width="'+(drawL+2*WALL)+'" height="'+WALL+'" fill="url(#hatch_'+pi+')" stroke="#3d3528" stroke-width="1"/>';
  // Mur gauche
  svg += '<rect x="'+(ox-WALL)+'" y="'+(oy-WALL)+'" width="'+WALL+'" height="'+(drawW+2*WALL)+'" fill="url(#hatch_'+pi+')" stroke="#3d3528" stroke-width="1"/>';
  // Mur droit
  svg += '<rect x="'+(ox+drawL)+'" y="'+(oy-WALL)+'" width="'+WALL+'" height="'+(drawW+2*WALL)+'" fill="url(#hatch_'+pi+')" stroke="#3d3528" stroke-width="1"/>';

  // Mur bas avec ouverture porte (80cm côté gauche)
  var doorW = Math.min(0.8*scale, drawL*0.3);
  var doorX = ox; // pivot à l'angle gauche-bas
  // Partie gauche mur bas (avant porte)
  svg += '<rect x="'+(ox-WALL)+'" y="'+(oy+drawW)+'" width="'+WALL+'" height="'+WALL+'" fill="url(#hatch_'+pi+')" stroke="#3d3528" stroke-width="1"/>'; // coin bas-gauche
  // Partie droite mur bas (après porte)
  svg += '<rect x="'+(ox+doorW)+'" y="'+(oy+drawW)+'" width="'+(drawL-doorW+WALL)+'" height="'+WALL+'" fill="url(#hatch_'+pi+')" stroke="#3d3528" stroke-width="1"/>';

  // Porte : arc + battant, pivot en (ox, oy+drawW)
  svg += '<line x1="'+ox+'" y1="'+(oy+drawW)+'" x2="'+ox+'" y2="'+(oy+drawW-doorW)+'" stroke="#3d3528" stroke-width="1.2"/>';
  svg += '<path d="M '+ox+' '+(oy+drawW)+' A '+doorW+' '+doorW+' 0 0 1 '+(ox+doorW)+' '+(oy+drawW)+'" fill="rgba(180,160,120,.12)" stroke="#3d3528" stroke-width="0.9" stroke-dasharray="5,3"/>';

  // Fenêtre mur haut (si pièce assez grande)
  if(drawL > 80) {
    var winX = ox + drawL*0.35, winW = Math.min(80, drawL*0.3);
    svg += '<rect x="'+winX+'" y="'+(oy-WALL)+'" width="'+winW+'" height="'+WALL+'" fill="#d4eaf7"/>';
    svg += '<line x1="'+winX+'" y1="'+(oy-WALL+4)+'" x2="'+(winX+winW)+'" y2="'+(oy-WALL+4)+'" stroke="#3b82f6" stroke-width="2"/>';
    svg += '<line x1="'+winX+'" y1="'+(oy-WALL+9)+'" x2="'+(winX+winW)+'" y2="'+(oy-WALL+9)+'" stroke="#3b82f6" stroke-width="1"/>';
  }

  // Surface
  svg += '<text x="'+(ox+drawL/2)+'" y="'+(oy+drawW/2-4)+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2d2820" opacity="0.2">'+(roomL*roomW).toFixed(2)+' m\xB2</text>';

  // ═══ COTATIONS style archi ═══
  var cotOff = 28;

  // Largeur (bas)
  var cy = oy + drawW + WALL + cotOff;
  svg += '<line x1="'+(ox-WALL)+'" y1="'+cy+'" x2="'+(ox+drawL+WALL)+'" y2="'+cy+'" stroke="#2d2820" stroke-width="0.8"/>';
  svg += '<line x1="'+(ox-WALL)+'" y1="'+(cy-6)+'" x2="'+(ox-WALL)+'" y2="'+(cy+6)+'" stroke="#2d2820" stroke-width="0.6"/>';
  svg += '<line x1="'+(ox+drawL+WALL)+'" y1="'+(cy-6)+'" x2="'+(ox+drawL+WALL)+'" y2="'+(cy+6)+'" stroke="#2d2820" stroke-width="0.6"/>';
  svg += '<line x1="'+(ox-WALL)+'" y1="'+cy+'" x2="'+(ox-WALL+14)+'" y2="'+(cy-2)+'" stroke="#2d2820" stroke-width="0.8"/>';
  svg += '<line x1="'+(ox-WALL)+'" y1="'+cy+'" x2="'+(ox-WALL+14)+'" y2="'+(cy+2)+'" stroke="#2d2820" stroke-width="0.8"/>';
  svg += '<line x1="'+(ox+drawL+WALL)+'" y1="'+cy+'" x2="'+(ox+drawL+WALL-14)+'" y2="'+(cy-2)+'" stroke="#2d2820" stroke-width="0.8"/>';
  svg += '<line x1="'+(ox+drawL+WALL)+'" y1="'+cy+'" x2="'+(ox+drawL+WALL-14)+'" y2="'+(cy+2)+'" stroke="#2d2820" stroke-width="0.8"/>';
  svg += '<rect x="'+(ox+drawL/2-22)+'" y="'+(cy-8)+'" width="44" height="14" fill="#f5f0e8"/>';
  svg += '<text x="'+(ox+drawL/2)+'" y="'+(cy+3)+'" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="bold" fill="#2d2820">'+roomL.toFixed(2)+' m</text>';

  // Hauteur (gauche)
  var cx2 = ox - WALL - cotOff;
  svg += '<line x1="'+cx2+'" y1="'+(oy-WALL)+'" x2="'+cx2+'" y2="'+(oy+drawW+WALL)+'" stroke="#2d2820" stroke-width="0.8"/>';
  svg += '<line x1="'+(cx2-6)+'" y1="'+(oy-WALL)+'" x2="'+(cx2+6)+'" y2="'+(oy-WALL)+'" stroke="#2d2820" stroke-width="0.6"/>';
  svg += '<line x1="'+(cx2-6)+'" y1="'+(oy+drawW+WALL)+'" x2="'+(cx2+6)+'" y2="'+(oy+drawW+WALL)+'" stroke="#2d2820" stroke-width="0.6"/>';
  svg += '<text x="'+cx2+'" y="'+(oy+drawW/2+4)+'" text-anchor="middle" font-family="Courier New,monospace" font-size="10" font-weight="bold" fill="#2d2820" transform="rotate(-90,'+cx2+','+(oy+drawW/2)+')">'+roomW.toFixed(2)+' m</text>';

  // Échelle graphique
  var scaleX = ox, scaleY = oy + drawW + WALL + cotOff + 20;
  var bar = scale; // 1m = scale px
  svg += '<rect x="'+scaleX+'" y="'+scaleY+'" width="'+bar+'" height="5" fill="#2d2820"/>';
  svg += '<rect x="'+(scaleX+bar)+'" y="'+scaleY+'" width="'+bar+'" height="5" fill="#f5f0e8" stroke="#2d2820" stroke-width="0.6"/>';
  svg += '<text x="'+scaleX+'" y="'+(scaleY+14)+'" font-family="Arial,sans-serif" font-size="7" fill="#5a5040">0</text>';
  svg += '<text x="'+(scaleX+bar)+'" y="'+(scaleY+14)+'" font-family="Arial,sans-serif" font-size="7" fill="#5a5040">1m</text>';
  svg += '<text x="'+(scaleX+2*bar)+'" y="'+(scaleY+14)+'" font-family="Arial,sans-serif" font-size="7" fill="#5a5040">2m</text>';

  // ═══ CARTOUCHE ═══
  var cartY = H - CART_H;
  svg += '<rect x="6" y="'+cartY+'" width="'+(W-12)+'" height="'+CART_H+'" fill="#2d2820"/>';
  var col = (W-12)/4;
  for(var ci=1;ci<4;ci++) svg += '<line x1="'+(6+col*ci)+'" y1="'+cartY+'" x2="'+(6+col*ci)+'" y2="'+H+'" stroke="#5a5040" stroke-width="0.7"/>';

  svg += '<text x="16" y="'+(cartY+11)+'" font-family="Arial,sans-serif" font-size="7" fill="rgba(255,255,255,.5)" letter-spacing="0.8">ENTREPRISE</text>';
  svg += '<text x="16" y="'+(cartY+24)+'" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">'+escSVG(ent)+'</text>';
  svg += '<text x="16" y="'+(cartY+37)+'" font-family="Arial,sans-serif" font-size="8" fill="rgba(255,255,255,.6)">'+dateStr+'</text>';

  svg += '<text x="'+(6+col+10)+'" y="'+(cartY+11)+'" font-family="Arial,sans-serif" font-size="7" fill="rgba(255,255,255,.5)" letter-spacing="0.8">CLIENT</text>';
  svg += '<text x="'+(6+col+10)+'" y="'+(cartY+24)+'" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">'+escSVG(clientStr)+'</text>';
  svg += '<text x="'+(6+col+10)+'" y="'+(cartY+37)+'" font-family="Arial,sans-serif" font-size="8" fill="rgba(255,255,255,.6)">'+escSVG(piece.nom)+'</text>';

  svg += '<text x="'+(6+col*2+10)+'" y="'+(cartY+11)+'" font-family="Arial,sans-serif" font-size="7" fill="rgba(255,255,255,.5)" letter-spacing="0.8">PLAN</text>';
  svg += '<text x="'+(6+col*2+10)+'" y="'+(cartY+24)+'" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Vue en plan</text>';
  svg += '<text x="'+(6+col*2+10)+'" y="'+(cartY+37)+'" font-family="Arial,sans-serif" font-size="8" fill="rgba(255,255,255,.6)">Echelle 1:'+(Math.round(100/scale*10)/10)+'</text>';

  svg += '<text x="'+(6+col*3+10)+'" y="'+(cartY+11)+'" font-family="Arial,sans-serif" font-size="7" fill="rgba(255,255,255,.5)" letter-spacing="0.8">SURFACE</text>';
  svg += '<text x="'+(6+col*3+10)+'" y="'+(cartY+24)+'" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#4a9eff">'+(roomL*roomW).toFixed(2)+' m\xB2</text>';

  svg += '</svg>';
  return svg;
}

function escSVG(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openPlanCoté() {
  var hasSol = _pieces.some(function(p){ return p.sol.l && p.sol.w; });
  if(!hasSol) { toast('Renseigne les dimensions dans Surfaces d\'abord','err'); setMMode('surface'); return; }

  var client = _metrClientId ? DB.clients.find(function(c){return c.id===_metrClientId;}) : null;
  var h = '';
  _pieces.forEach(function(piece, pi) {
    if(!piece.sol.l || !piece.sol.w) return;
    h += '<div style="margin-bottom:16px">';
    h += '<div style="font-size:12px;font-weight:700;color:#16243c;margin-bottom:8px">'+escSVG(piece.nom)+'</div>';
    h += generateSVGPlan(piece, pi);
    h += '</div>';
  });

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">';
  h += '<button onclick="exportPlanPDF()" style="padding:12px;background:linear-gradient(135deg,#dc2626,#ef4444);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer">Imprimer / PDF</button>';
  h += '<button onclick="exportPlanSVG()" style="padding:12px;background:linear-gradient(135deg,#0369a1,#0ea5e9);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer">Exporter SVG</button>';
  h += '</div>';
  h += '<div class="btns" style="margin-top:10px"><button class="btn secondary" data-close>Fermer</button></div>';

  modal('Plan coté', h);
}

function exportPlanPDF() {
  var svgs = '';
  _pieces.forEach(function(piece, pi) {
    if(piece.sol.l && piece.sol.w) svgs += '<div style="page-break-inside:avoid;margin-bottom:30px">'+generateSVGPlan(piece,pi)+'</div>';
  });
  var client = _metrClientId ? DB.clients.find(function(c){return c.id===_metrClientId;}) : null;
  var clientStr = client ? ([client.prenom,client.nom].filter(Boolean).join(' ')||'Client') : 'Estimation libre';
  var html = '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Plans — '+escSVG(clientStr)+'</title>'
    +'<style>body{font-family:Arial,sans-serif;margin:15mm;color:#16243c}h1{font-size:16px;margin-bottom:4px}p{font-size:11px;color:#607590;margin-bottom:20px}@media print{@page{margin:10mm}}</style></head><body>'
    +'<h1>Plans cotes — '+escSVG(clientStr)+'</h1>'
    +'<p>'+DB.settings.entreprise+' · '+new Date().toLocaleDateString('fr-FR')+'</p>'
    +svgs
    +'<scr'+'ipt>setTimeout(function(){window.print();},300);<'+'/script>'
    +'</body></html>';
  var w = window.open('','_blank');
  if(w){ w.document.write(html); w.document.close(); }
  else toast('Autorise les popups dans Safari','err');
}

function exportPlanSVG() {
  var piece = _pieces.find(function(p){ return p.sol.l && p.sol.w; });
  if(!piece) return;
  var svgStr = generateSVGPlan(piece, 0);
  var blob = new Blob([svgStr], {type:'image/svg+xml'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='plan-'+piece.nom.replace(/\s+/g,'-')+'.svg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Plan SVG exporté','ok');
}


// ══════════════════════════════════════════════
// FIREBASE AUTH + SYNC
// ══════════════════════════════════════════════

var _authMode = 'login';

function showAuthTab(mode) {
  _authMode = mode;
  var isSU = mode==='signup';
  var nr = document.getElementById('auth-name-row');
  var tl = document.getElementById('tab-login');
  var ts = document.getElementById('tab-signup');
  var btn = document.getElementById('auth-btn');
  var rb = document.getElementById('auth-reset-btn');
  if(nr) nr.style.display = isSU?'block':'none';
  if(tl){tl.style.background=isSU?'transparent':'#fff';tl.style.color=isSU?'rgba(255,255,255,.65)':'#1e3a5f';}
  if(ts){ts.style.background=isSU?'#fff':'transparent';ts.style.color=isSU?'#1e3a5f':'rgba(255,255,255,.65)';}
  if(btn) btn.textContent = isSU?'Creer mon compte':'Se connecter';
  if(rb) rb.style.display = isSU?'none':'block';
  var err = document.getElementById('auth-err'); if(err) err.style.display='none';
}

function doAuth() {
  var email = (document.getElementById('auth-email')||{}).value||'';
  var pass = (document.getElementById('auth-password')||{}).value||'';
  var name = (document.getElementById('auth-name')||{}).value||'';
  var errEl = document.getElementById('auth-err');
  var btn = document.getElementById('auth-btn');
  if(!email||!pass){if(errEl){errEl.textContent='Email et mot de passe requis.';errEl.style.display='block';}return;}
  if(pass.length<6){if(errEl){errEl.textContent='Mot de passe : minimum 6 caracteres.';errEl.style.display='block';}return;}
  if(btn){btn.textContent='...';btn.disabled=true;}
  if(errEl) errEl.style.display='none';
  var FB=window._FB;
  if(!FB){if(errEl){errEl.textContent='Firebase non disponible, rechargez.';errEl.style.display='block';}if(btn){btn.disabled=false;btn.textContent=_authMode==='signup'?'Creer mon compte':'Se connecter';}return;}
  var promise = _authMode==='signup'
    ? FB.createUserWithEmailAndPassword(FB.auth,email,pass)
    : FB.signInWithEmailAndPassword(FB.auth,email,pass);
  promise.then(function(cred){
    if(_authMode==='signup'&&name){DB.settings.entreprise=name;save();}
  }).catch(function(e){
    var msg = e.code==='auth/user-not-found'?'Compte introuvable.'
      :e.code==='auth/wrong-password'?'Mot de passe incorrect.'
      :e.code==='auth/invalid-credential'?'Email ou mot de passe incorrect.'
      :e.code==='auth/email-already-in-use'?'Email deja utilise.'
      :e.code==='auth/invalid-email'?'Email invalide.'
      :e.code==='auth/too-many-requests'?'Trop de tentatives, reessayez plus tard.'
      :e.message;
    if(errEl){errEl.textContent=msg;errEl.style.display='block';}
    if(btn){btn.disabled=false;btn.textContent=_authMode==='signup'?'Creer mon compte':'Se connecter';}
  });
}

function doReset() {
  var email=(document.getElementById('auth-email')||{}).value||'';
  var errEl=document.getElementById('auth-err'),okEl=document.getElementById('auth-reset-ok');
  if(!email){if(errEl){errEl.textContent='Entre ton email dabord.';errEl.style.display='block';}return;}
  var FB=window._FB; if(!FB) return;
  FB.sendPasswordResetEmail(FB.auth,email).then(function(){if(okEl)okEl.style.display='block';if(errEl)errEl.style.display='none';}).catch(function(e){if(errEl){errEl.textContent=e.message;errEl.style.display='block';}});
}

function doLogout() {
  var FB=window._FB; if(!FB) return;
  if(!confirm('Se deconnecter ?')) return;
  if(window._fbStopSync) window._fbStopSync();
  FB.signOut(FB.auth);
}

window._onLoginSuccess = function(user) {
  var as=document.getElementById('auth-screen'); if(as) as.style.display='none';
  var ub=document.getElementById('user-bar'); if(ub) ub.style.display='flex';
  var ut=document.getElementById('user-email-txt'); if(ut) ut.textContent=user.email;
  if(window._fbStartSync) {
    window._fbStartSync(user.uid, function(cloudData) {
      try {
        var lt=DB._updatedAt||0, ct=cloudData._updatedAt||0;
        if(ct>lt){DB=cloudData;save();renderAll();if(typeof updateHeaderLogo==='function')updateHeaderLogo();}
      } catch(e){}
    });
  }
  setTimeout(function(){DB._updatedAt=Date.now();if(window._fbSave)window._fbSave(DB);},800);
  toast('Connecte : '+user.email,'ok');
};

window._onLogout = function() {
  var as=document.getElementById('auth-screen'); if(as) as.style.display='flex';
  var ub=document.getElementById('user-bar'); if(ub) ub.style.display='none';
};

// Patch save pour synchro auto
var _origSave2 = typeof save==='function' ? save : function(){};
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){}
  if(window._currentUser&&window._fbSave){DB._updatedAt=Date.now();window._fbSave(DB);}
}

})();
